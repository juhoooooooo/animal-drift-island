const SAVE_KEY='animal-island-v1';

function freshSave() {return {version:1,completed:{},residents:[],coins:100,wood:30,food:12,buildings:{home:1,garden:0,sawmill:0},claims:[],sound:true};}
function loadSave(storage,levelCount=LEVELS.length) {
  try {
    const raw=JSON.parse(storage.getItem(SAVE_KEY));
    if(!raw||raw.version!==1)return freshSave();
    const clean=freshSave();
    for(const key of ['coins','wood','food'])if(Number.isFinite(raw[key])&&raw[key]>=0)clean[key]=Math.floor(raw[key]);
    for(const [key,value]of Object.entries(raw.completed||{}))if(/^[1-9]\d*$/.test(key)&&Number(key)<=levelCount&&Number.isInteger(value)&&value>=1&&value<=3)clean.completed[key]=value;
    const ids=new Set();
    clean.residents=(Array.isArray(raw.residents)?raw.residents:[]).filter(a=>a&&typeof a.id==='string'&&['rabbit','cat','dog','penguin'].includes(a.type)&&!ids.has(a.id)&&ids.add(a.id)).map(a=>({id:a.id,type:a.type,name:String(a.name||'新玩伴').slice(0,20),job:['rest','garden','sawmill'].includes(a.job)?a.job:'rest',lastHarvest:Number.isFinite(a.lastHarvest)?a.lastHarvest:Date.now()}));
    for(const key of ['home','garden','sawmill'])if(Number.isInteger(raw.buildings?.[key]))clean.buildings[key]=Math.max(key==='home'?1:0,Math.min(5,raw.buildings[key]));
    clean.claims=Array.isArray(raw.claims)?raw.claims.filter(c=>typeof c==='string'):[];
    clean.sound=raw.sound!==false;return clean;
  } catch {return freshSave();}
}
function persist(storage,save) {try{storage.setItem(SAVE_KEY,JSON.stringify(save));return true;}catch{return false;}}
function recordWin(save,game) {
  const first=!save.completed[game.levelId],stars=game.limit?Math.max(1,Math.min(3,1+Math.floor((game.limit-game.moves)/3))):3;
  save.completed[game.levelId]=Math.max(save.completed[game.levelId]||0,stars);
  if(first) {

function loadSession(storage,levels=LEVELS) {

// Keep tile DOM nodes alive across frames. Their stable engine IDs are also the
// animation identity, so a falling tile carries its animal artwork with it.
class BoardView {
  constructor(element,{board,n,tileHTML,reducedMotion=false}) {
    this.element=element;this.n=n;this.tileHTML=tileHTML;this.reducedMotion=reducedMotion;
    this.nodes=new Map();this.animations=new Set();this.dragged=new Set();this.waits=new Set();this.disposed=false;
    this.slots=[...element.querySelectorAll('.board-cell')];
    for(const node of element.querySelectorAll('.tile[data-id]'))this.nodes.set(Number(node.dataset.id),node);
    this.board=board;this.update(board);element.dataset.phase='idle';
  }
  makeTile(tile,index) {
    const template=document.createElement('template');template.innerHTML=this.tileHTML(tile,index);
    return template.content.firstElementChild;
  }
  patch(node,tile,index) {
    const next=this.makeTile(tile,index),signature=JSON.stringify([tile.level,tile.capacity,tile.animals,tile.camp]);
    if(node.className!==next.className)node.className=next.className;
    node.dataset.index=String(index);
    node.setAttribute('aria-label',next.getAttribute('aria-label'));
    if(next.hasAttribute('aria-disabled'))node.setAttribute('aria-disabled','true');else node.removeAttribute('aria-disabled');
    if(node._visualSignature!==signature) {
      // Only artwork that really changed is patched; stationary SVGs stay put.
      if(node.innerHTML!==next.innerHTML)node.replaceChildren(...next.childNodes);
      node._visualSignature=signature;
    }
  }
  reconcile(board,{keepRemoved=false}={}) {
    const old=new Map(this.nodes),next=new Map(),created=[];
    board.forEach((tile,index)=>{
      if(!tile)return;
      let node=old.get(tile.id);
      if(!node){node=this.makeTile(tile,index);created.push({tile,index,node});}
      this.patch(node,tile,index);
      if(node.parentElement!==this.slots[index])this.slots[index].append(node);
      next.set(tile.id,node);
    });
    const removed=[...old].filter(([id])=>!next.has(id)).map(([id,node])=>({id,node,index:Number(node.dataset.index)}));
    if(!keepRemoved)for(const {node}of removed)node.remove();
    this.nodes=next;this.board=board;
    return {created,removed};
  }
  update(board) {
    if(this.disposed)return;
    this.resetDrag();this.reconcile(board);
  }
  async animate(node,keyframes,options={}) {
    if(this.disposed||this.reducedMotion||document.hidden||!node.animate)return;
    const timing={duration:360,easing:'cubic-bezier(.22,.68,.3,1)',fill:'both',...options};
    const animation=node.animate(keyframes,timing);
    this.animations.add(animation);
    let fallback;
    try{await Promise.race([animation.finished,new Promise(resolve=>fallback=setTimeout(resolve,timing.duration+(timing.delay||0)+150))]);}catch{}finally{clearTimeout(fallback);animation.cancel();this.animations.delete(animation);}
  }
  rects() {
    return new Map([...this.nodes].map(([id,node])=>[id,node.getBoundingClientRect()]));
  }
  wait(ms) {
    if(this.disposed||document.hidden)return Promise.resolve();
    return new Promise(resolve=>{
      const task={timer:null,finish:()=>{clearTimeout(task.timer);this.waits.delete(task);resolve();}};
      task.timer=setTimeout(task.finish,ms);this.waits.add(task);
    });
  }
  async transition(frame) {
    if(this.disposed)return;
    const board=this.element;
    board.dataset.phase=frame.kind;
    if(frame.kind==='shuffle-notice') {
      this.update(frame.board);
      const notice=document.createElement('div');notice.className='shuffle-notice';notice.setAttribute('role','status');
      notice.innerHTML='<span class="shuffle-notice-mark" aria-hidden="true">↻</span><strong>没有可移动的地块了</strong><span>棋盘即将变化</span><small>动物和营地都会保留</small>';
      board.append(notice);
      await this.wait(1200);
      notice.remove();if(!this.disposed)board.dataset.phase='idle';return;
    }
    if(this.reducedMotion){this.update(frame.board);board.dataset.phase='idle';return;}
    const before=this.rects(),oldBoard=this.board;
    // Read the visible drag positions before clearing the preview transforms.
    this.resetDrag();
    const {created,removed}=this.reconcile(frame.board,{keepRemoved:frame.kind==='merge'}),tasks=[];
    if(frame.kind==='camp-build') {
      for(const camp of frame.camps) {
        const node=this.slots[camp.at].querySelector('.camp-art');
        if(node)tasks.push(this.animate(node,[{transform:'scale(.72,.2)',transformOrigin:'50% 85%',opacity:0},{transform:'scale(.98,.94)',transformOrigin:'50% 85%',opacity:1,offset:.7},{transform:'scale(1)',transformOrigin:'50% 85%',opacity:1}],{duration:520}));
      }
    } else if(frame.kind==='camp-enter') {
      const sources=new Set();
      for(let k=0;k<frame.entries.length;k++) {
        const entry=frame.entries[k],from=this.slots[entry.from].getBoundingClientRect(),to=this.slots[entry.to].getBoundingClientRect(),bounds=board.getBoundingClientRect();
        const size=Math.min(from.width*.5,38),visitor=document.createElement('span');visitor.className='camp-visitor';visitor.innerHTML=animalArt(entry.animal.type);
        visitor.style.width=visitor.style.height=`${size}px`;visitor.style.left=`${from.left-bounds.left+from.width*.25}px`;visitor.style.top=`${from.top-bounds.top+from.height*.07}px`;
        board.append(visitor);
        const dx=to.left-from.left+to.width*.5-from.width*.25-size*.5,dy=to.top-from.top+to.height*.68-from.height*.07-size*.65;
        const portrait=this.slots[entry.from].querySelector('.tile-animal');if(portrait){portrait.style.visibility='hidden';sources.add(portrait);}
        tasks.push(this.animate(visitor,[{transform:'translate(0,0) scale(1)',opacity:1},{transform:`translate(${dx*.65}px,${dy*.65-7}px) scale(.94)`,opacity:1,offset:.65},{transform:`translate(${dx}px,${dy}px) scale(.55)`,opacity:.15}],{duration:650,delay:Math.min(k*100,300)}).then(()=>visitor.remove()));
      }
      await Promise.all(tasks);
      // The next rescue frame replaces standing animals with visible residents.
      for(const portrait of sources)portrait.style.removeProperty('visibility');
      if(!this.disposed)board.dataset.phase='idle';return;
    } else if(frame.kind==='merge') {
      for(const {node,index}of removed) {
        const upgrade=frame.upgrades.find(u=>u.sources.includes(index));
        const from=before.get(Number(node.dataset.id)),to=upgrade&&this.slots[upgrade.at].getBoundingClientRect();
        if(!from||!to){node.remove();continue;}
        node.classList.add('tile-in-flight');
        const dx=to.left-from.left,dy=to.top-from.top;
        tasks.push(this.animate(node,[{transform:'translate(0,0) scale(1)',opacity:1},{transform:`translate(${dx*.8}px,${dy*.8}px) scale(.68)`,opacity:.9,offset:.72},{transform:`translate(${dx}px,${dy}px) scale(.5)`,opacity:0}],{duration:300}).then(()=>node.remove()));
      }
      for(const {node}of created)tasks.push(this.animate(node,[{transform:'scale(.82)',opacity:0},{transform:'scale(.97)',opacity:.9,offset:.65},{transform:'scale(1)',opacity:1}],{duration:260,delay:140}));
    } else {
      for(const [id,node]of this.nodes) {
        const from=before.get(id),to=node.getBoundingClientRect();
        if(!from)continue;
        const dx=from.left-to.left,dy=from.top-to.top;
        if(Math.abs(dx)<.5&&Math.abs(dy)<.5)continue;
        node.classList.add('tile-in-flight');
        const keys=frame.kind==='shuffle'?[
          {transform:`translate(${dx}px,${dy}px)`},
          {transform:`translate(${dx*.5}px,${dy*.5-Math.min(20,Math.abs(dx)*.08)}px)`,offset:.5},
          {transform:'translate(0,0)'}
        ]:[{transform:`translate(${dx}px,${dy}px)`},{transform:'translate(0,0)'}];
        tasks.push(this.animate(node,keys,{duration:frame.kind==='shuffle'?720:frame.kind==='fall'?Math.min(540,380+Math.abs(dy)*.3):340}).then(()=>node.classList.remove('tile-in-flight')));
      }
      if(frame.kind==='fall')for(const {node,index}of created) {
        const row=Math.floor(index/this.n),col=index%this.n,to=this.slots[index].getBoundingClientRect();
        let top=0;
        for(let r=row-1;r>=0;r--)if(isFixed(frame.board[r*this.n+col])){top=r+1;break;}
        const births=created.filter(t=>t.index%this.n===col&&Math.floor(t.index/this.n)>=top&&Math.floor(t.index/this.n)<=row).length;
        const previousFixed=top>0;
        const distance=previousFixed?to.height*.7:(row-top+births)*to.height;
        const dy=-Math.max(to.height*.75,distance);
        node.classList.add('tile-in-flight');
        tasks.push(this.animate(node,[{transform:`translateY(${dy}px)`,opacity:0},{transform:`translateY(${dy*.5}px)`,opacity:1,offset:.28},{transform:'translateY(0)',opacity:1}],{duration:Math.min(540,400+Math.abs(dy)*.25)}).then(()=>node.classList.remove('tile-in-flight')));
      }
      if(frame.kind==='rescue') {
        const rescued=new Set(frame.rescued.map(a=>a.id));
        const destinations=new Set(frame.entries?.map(e=>e.to)||[]);
        oldBoard.forEach((tile,index)=>{
          if(destinations.size?!destinations.has(index):!tile?.animals.some(a=>rescued.has(a.id)))return;
          const slot=this.slots[index],spark=document.createElement('span');spark.className='rescue-spark';spark.textContent='♥';slot.append(spark);
          tasks.push(this.animate(spark,[{transform:'translateY(0) scale(.85)',opacity:0},{transform:'translateY(-14px) scale(1)',opacity:.8,offset:.4},{transform:'translateY(-28px) scale(1)',opacity:0}],{duration:480}).then(()=>spark.remove()));
        });
      }
    }
    await Promise.all(tasks);
    if(!this.disposed)board.dataset.phase='idle';
  }
  previewDrag(index,to,progress) {
    if(this.disposed)return;
    this.resetDrag();
    const fromTile=this.board[index],toTile=this.board[to];
    if(!fromTile||!toTile||[fromTile,toTile].some(t=>t.level<0))return;
    if((isHouse(fromTile)||isHouse(toTile))&&!canExchange(this.board,this.n,index,to))return;
    const a=this.nodes.get(fromTile.id),b=this.nodes.get(toTile.id),ar=this.slots[index].getBoundingClientRect(),br=this.slots[to].getBoundingClientRect();
    const dx=(br.left-ar.left)*progress,dy=(br.top-ar.top)*progress;
    for(const [node,x,y]of [[a,dx,dy],[b,-dx,-dy]]) {
      node.classList.add('tile-dragging');node.style.transform=`translate(${x}px,${y}px)`;this.dragged.add(node);
    }
  }
  resetDrag() {
    for(const node of this.dragged){node.style.removeProperty('transform');node.classList.remove('tile-dragging');}
    this.dragged.clear();
  }
  async returnDrag() {
    const positions=this.rects();this.resetDrag();const tasks=[];
    for(const [id,node]of this.nodes) {
      const from=positions.get(id),to=node.getBoundingClientRect(),dx=from.left-to.left,dy=from.top-to.top;
      if(Math.abs(dx)+Math.abs(dy)>.5)tasks.push(this.animate(node,[{transform:`translate(${dx}px,${dy}px)`},{transform:'translate(0,0)'}],{duration:220}));
    }
    await Promise.all(tasks);
  }
  destroy() {
    this.disposed=true;this.resetDrag();
    for(const a of this.animations)a.cancel();this.animations.clear();
    for(const task of [...this.waits])task.finish();
  }
  finish() {for(const animation of this.animations)try{animation.finish();}catch{}for(const task of [...this.waits])task.finish();}
}

 return `<div class="home-grid"><section><div class="island-header"><div><div class="eyebrow">第一章 · 海风来信</div><h1 class="page-title">一座小岛，等你一起长大。</h1><p class="subtext">${save.residents.length?'今天也有新的朋友，等着我们带它回家。':'海风送来了第一封信，去接一位新朋友吧。'}</p></div><div class="weather"><span class="sun"></span>晴 · 微风</div></div><div class="island-view"><div class="island-caption">${icon('flag')}我们的漂流岛</div>${islandArt(save)}<span class="island-tag">${save.buildings.home>1?'暖暖小屋 Lv.'+save.buildings.home:'暖暖小屋'}</span><div class="island-count">${icon('paw')} ${save.residents.length} 位玩伴 · ${done()} 次相逢</div><span class="sea-note">HOME, SWEET ISLAND</span></div><div class="journey-strip"><div class="journey-copy"><div class="journey-icon">${icon('boat')}</div><div><strong>${active?(game.building?'把这片海域，慢慢变成家':game.status==='won'?'玩伴们正在营地等你':game.status==='lost'?'休息好了，再试一次':'伙伴们还在等你'):'下一站 · '+level.title}</strong><small>${active?`已保存 · 第 ${String(level.id).padStart(2,'0')} 关 · ${game.moves} 次交换`:`第 ${String(level.id).padStart(2,'0')} 关 · ${level.animals.length} 位玩伴等你回家`}</small></div></div><button class="primary warm" data-action="${active?'resume':'start'}" data-level="${level.id}">${active?(game.building?'继续合成':game.status==='won'?'看看营地':game.status==='lost'?'查看棋盘':'继续救援'):done()===LEVELS.length?'再次出航':'出发救援'} ${icon('arrow')}</button></div>${footer()}</section><aside class="side-panel"><section class="card"><div class="card-heading"><h2>小岛心愿</h2><span>累计里程碑</span></div>${taskHTML('rescue')}${taskHTML('levels')}<p class="card-foot">每一次平安靠岸，都让小岛更热闹一点。<br>重玩关卡不会重复累计玩伴和奖励。</p></section><section class="card"><div class="card-heading"><h2>岛上的新朋友</h2><button class="text-button" data-action="nav" data-route="friends">看看大家 ${icon('arrow')}</button></div>${save.residents.length?`<div class="friend-note"><div class="portrait" style="background:${ANIMALS[save.residents.at(-1).type].color}">${animalArt(save.residents.at(-1).type)}</div><div><strong>${escapeHTML(save.residents.at(-1).name)}</strong><p>“有你在，这里就是家。”</p></div></div>`:`<div class="friend-note"><div class="portrait">${animalArt('rabbit')}</div><div><strong>第一位玩伴还在海上</strong><p>棉棉，正等着你的救援。</p></div></div>`}<div class="small-empty">${save.residents.length?'安排工作，一起照顾我们的小岛。':'把玩伴带回家，它就会出现在小岛上。'}</div></section><section class="card"><div class="card-heading"><h2>慢慢生活</h2><span>小岛工坊</span></div><button class="production-button" data-action="collect">${icon('leaf')}<span id="production-label">${pending.food+pending.wood?`可收取 ${pending.food} 食物 · ${pending.wood} 木材`:'安排玩伴，收获一点小美好'}</span>${icon('arrow')}</button><button class="text-button" data-action="nav" data-route="build" style="margin-top:14px">去建设小岛 ${icon('arrow')}</button><button class="text-button" data-action="supplies" style="margin-top:12px">交付补给，换取金币 ${icon('arrow')}</button></section></aside></div>`;
}
function tileHTML(t,i){
 if(!t)return `<div class="tile blank" aria-hidden="true"></div>`;
 const animals=t.animals||[],urgent=animals.filter(a=>a.timer!==null),timer=urgent.length?Math.min(...urgent.map(a=>a.timer)):null;
 const residents=t.camp?.occupants||[];
 const house=isHouse(t),facility=house?TERRAIN[t.level]:'帐篷';
 const label=`第 ${Math.floor(i/game.n)+1} 行第 ${i%game.n+1} 列，${t.level<0?'岩石':`T${t.level} ${TERRAIN[t.level]}`}${house?(t.level===MAX_TIER?'，满级固定':'，固定，仅参与同级三连升级时可交换'):''}${animals.length?'，'+animals.map(a=>ANIMALS[a.type].label).join('、'):''}${t.camp?'，'+facility+'已入住 '+residents.length+' 位'+(residents.length?'：'+residents.map(a=>ANIMALS[a.type].label).join('、'):''):''}${house?'，空余 '+t.capacity+' 个位置':''}${timer!==null?'，紧急剩余 '+timer+' 步':''}`;
 const camp=t.camp?`${t.camp.kind==='tent'?`<div class="camp-art">${tentArt()}</div>`:''}<div class="camp-residents" aria-hidden="true">${residents.slice(0,3).map(a=>`<span data-resident-id="${a.id}">${animalArt(a.type)}</span>`).join('')}</div>${residents.length?`<span class="camp-count">${residents.length}${house?'/'+houseCapacity(t.level):''}位</span>`:''}`:'';
 return `<button class="tile level-${t.level} ${t.camp?'has-camp camp-'+t.camp.kind:''} ${i===selected?'selected':''} ${hint.includes(i)?'hinted':''}" data-id="${t.id}" data-action="tile" data-index="${i}" aria-label="${label}" ${t.level<0||t.level===MAX_TIER?'aria-disabled="true"':''}>${terrainArt(t.level,t.capacity)}${house?`<span class="facility-tier">T${t.level}</span>`:''}${camp}${animals.length?`<div class="tile-animal ${t.level<3?'raft':''}">${animalArt(animals[0].type)}</div>${animals.length>1?`<span class="animal-count">${animals.length}</span>`:''}`:''}${timer!==null?`<span class="timer-badge">${timer}</span>`:''}${house&&!residents.length?`<span class="capacity">余 ${t.capacity}/${houseCapacity(t.level)}</span>`:''}</button>`;
}
function boardHTML(board=game.board){return board.map((t,i)=>`<div class="board-cell">${t?tileHTML(t,i):''}</div>`).join('');}
function legend(){return `<div class="terrain-legend" aria-label="地形升级顺序，从 T0 到 T7">${TERRAIN.map((name,i)=>`<div class="legend-item"><span class="legend-tier">T${i}${i===MAX_TIER?' · 满级':''}</span><div class="legend-tile level-${i}">${terrainArt(i)}</div><span>${name}</span></div>`).join('')}</div>`;}
function gamePage(){
 const level=activeLevel(),timers=game.board.flatMap(t=>t.animals).filter(a=>a.timer!==null).map(a=>a.timer);
 return `<div class="play-header"><button class="round-button" data-action="nav" data-route="home" aria-label="返回小岛">${icon('back')}</button><div><h1>${level.title}</h1><p>第 ${String(level.id).padStart(2,'0')} 关 · ${level.region}</p></div></div><div class="play-layout"><section class="game-sea"><div class="board-top"><span class="chapter-label">一 片 陆 地，一 个 新 家</span><span class="move-label ${timers.length?'urgent':''}" id="moves">${moveText(timers)}</span></div><div class="board" id="board" style="--n:${game.n}" role="group" aria-label="${game.n} 乘 ${game.n} 救援棋盘" aria-busy="${busy}">${boardHTML()}</div><div id="feedback" class="game-feedback" role="status">${playFeedback()}</div><div class="board-tools"><button class="tool-button" id="continue-building" data-action="build-terrain" ${game.status!=='won'?'hidden':''}>${icon('build')}继续合成到 T7</button><button class="tool-button" data-action="hint">${icon('hint')}看看提示</button><button class="tool-button" data-action="retry">${icon('reset')}重新出发</button><button class="tool-button" data-action="rules">${icon('help')}玩法</button></div>${legend()}<p class="control-help">每步自动保存 · 也可点选相邻地块 · 无效交换不扣步数</p></section><aside class="play-aside"><section class="card rescue-goal"><div class="goal-label">${game.building?'自由合成':'本次救援'}</div><div class="goal-number">${goalNumber()}</div><p class="goal-title">${goalTitle()}</p><div class="animal-goals">${level.animals.map(a=>`<div class="animal-goal ${game.rescued.some(s=>s.id===a.id)?'saved':''}" title="${ANIMALS[a.type].label}">${animalArt(a.type)}</div>`).join('')}</div><div id="terrain-objective" class="terrain-objective" ${!game.terrainGoal||game.building?'hidden':''}>${terrainObjectiveContent()}</div></section><section class="card tip-card"><strong>${icon('leaf').replace('class="icon ','class="icon ').replace('<svg ','<svg style="display:inline-block;width:16px;height:16px;vertical-align:middle;margin-right:5px" ')}海风小提醒</strong>${level.description}<br><br>${game.building?'继续把 T5 树林合并为 T6 小屋，再把三座小屋升级为 T7 救援中心。小屋和中心固定，不随地块掉落或棋盘整理移动。原有营地、玩伴都会保留。':game.mode==='beach'?'三连礁石升级为沙滩后，会搭起帐篷。玩伴走进去才算获救，会一直留在营地。同等级相连地块上的玩伴还能继续入住。':'沙滩及以上都是安全陆地。T6 小屋容纳 3 位，三座同级小屋连成一线升级为 T7 救援中心，可容纳 9 位。小屋平时固定，只有参与同级三连升级的交换才允许移动；入住玩伴全部保留。'}<button class="text-button" data-action="rules" style="margin-top:13px">查看完整玩法 ${icon('arrow')}</button></section><div class="status-card">${icon('heart')}不用赶路，每一份小小的帮助<br>都会被小岛记住。</div></aside></div>`;
}
function mapPage(){return `${sectionHeading('ISLAND JOURNAL · 02','沿着海风，寻找新朋友。','二十次出航，从第一次靠岸到共同建成救援中心。')}<div class="map-layout"><section class="map-sea"><div class="map-region">浅 湾 → 海 风 群 岛 → 灯 塔 海 域 → 晨 光 群 岛</div><div class="level-route">${LEVELS.map(l=>{const open=l.id<=unlocked(),completed=save.completed[l.id];return `<button class="level-node ${completed?'completed':l.id===unlocked()?'current':''}" data-action="start" data-level="${l.id}" ${!open?'disabled':''} aria-label="第 ${l.id} 关 ${l.title}${completed?'，已通关':''}"><span class="level-islet">${open?`<span class="node-number">${String(l.id).padStart(2,'0')}</span>`:icon('lock')}${completed?`<span class="node-stars">${'★'.repeat(completed)}</span>`:''}</span><small>${l.title}</small>${l.terrainGoal?`<span class="map-goal">T${l.terrainGoal.level} × ${l.terrainGoal.count}</span>`:''}</button>`;}).join('')}</div><div class="route-counter">已经留下 ${done()} 段平安回家的故事 / 共 ${LEVELS.length} 段</div></section><aside class="card"><div class="card-heading"><h2>我们的航海手记</h2><span>试玩版 0.6</span></div><p class="subtext">01—05 · 登岸搭帐篷，接玩伴入住<br><br>06—10 · 安全陆地与紧急救援<br><br>11—15 · 合并树林，建成更多 T6 小屋<br><br>16—20 · 三连小屋，挑战 T7 救援中心</p><div class="small-empty" style="margin-top:25px">新十关同时需要营救和建造。<br>每步都会保存，可以随时回来继续。</div></aside></div>${footer()}`;}
function friendsPage(){
 const housed=save.buildings.home*6,workers=save.residents.filter(a=>a.job!=='rest').length,residents=save.residents.filter(a=>animalFilter==='all'||a.type===animalFilter);
 return `${sectionHeading('OUR LITTLE FRIENDS','每一次相逢，都有了名字。','救回的玩伴会留在小岛上。为它们安排工作，一起把日子过好。')}<div class="residents-summary"><div class="summary-number">${save.residents.length}<small>小岛玩伴</small></div><div class="summary-divider"></div><div class="summary-number">${Math.min(save.residents.length,housed)} / ${housed}<small>小屋入住</small></div><div class="summary-divider"></div><div class="summary-number">${workers}<small>正在工作</small></div><button class="secondary" data-action="collect" style="margin-left:auto">收取产出</button></div><div class="species-row">${[['all','全部玩伴'],...Object.entries(ANIMALS).map(([key,v])=>[key,v.label])].map(([key,label])=>`<button class="species-button ${animalFilter===key?'active':''}" data-action="filter" data-filter="${key}">${key==='all'?icon('paw'):animalArt(key)}${label}</button>`).join('')}</div><div class="residents-grid">${residents.length?residents.map(a=>{const index=save.residents.indexOf(a),waiting=index>=housed;return `<article class="resident-card"><div class="portrait" style="background:${ANIMALS[a.type].color}">${animalArt(a.type)}</div><h2>${escapeHTML(a.name)}</h2><p>${waiting?'在码头等候 · 扩建小屋后入住':a.job==='rest'?'已入住 · 享受海风':a.job==='garden'?'在菜园照顾小芽 · 2 食物 / 30 秒':'在木工坊忙碌 · 2 木材 / 30 秒'}</p><div class="job-select">${[['rest','休息'],['garden','菜园'],['sawmill','木工']].map(([job,label])=>`<button class="${a.job===job?'chosen':''}" data-action="job" data-animal="${a.id}" data-job="${job}" ${waiting&&job!=='rest'?'disabled':''}>${label}</button>`).join('')}</div></article>`;}).join(''):`<div class="residents-empty">${animalArt(animalFilter==='all'?'rabbit':animalFilter,'empty-animal')}<h2>${save.residents.length?'这一位朋友，还在旅途中。':'小岛的故事，就从遇见你开始。'}</h2><p>出发救援，把漂流的玩伴带回家。</p><button class="primary warm" data-action="start" data-level="${nextLevel().id}">去接新朋友 ${icon('arrow')}</button></div>`}</div>${footer()}`;
}
function buildingCost(key){const level=save.buildings[key];return {coins:key==='home'?100*level:80*(level+1),wood:key==='home'?25*level:20*(level+1)};}
function suppliesSection(){
 return `<section id="supply-orders" class="card supply-section"><div class="card-heading"><h2>小岛补给站</h2><span>随时交付 · 可重复</span></div><p class="subtext">玩伴工作产出食物和木材。收取后交付补给，换取扩建小岛的金币。</p><div class="supply-balance"><span>${icon('leaf')}食物 <b>${save.food}</b></span><span>${icon('wood')}木材 <b>${save.wood}</b></span><span>${icon('coin')}金币 <b>${save.coins}</b></span></div><div class="supply-grid">${SUPPLY_ORDERS.map(order=>{const needs=[];if(order.food&&!save.buildings.garden)needs.push('菜园');if(order.wood&&!save.buildings.sawmill)needs.push('木工坊');const enough=save.food>=order.food&&save.wood>=order.wood,ready=!needs.length&&enough;return `<article class="supply-order"><span class="supply-symbol">${icon(order.id==='vegetables'?'leaf':order.id==='timber'?'wood':'boat')}</span><h3>${order.title}</h3><p>${[order.food?`${order.food} 食物`:'',order.wood?`${order.wood} 木材`:''].filter(Boolean).join(' + ')}</p><strong>${icon('coin')} +${order.coins} 金币</strong><button class="secondary" data-action="supply-order" data-order="${order.id}" ${!ready?'disabled':''}>${needs.length?'先建'+needs.join('和'):!enough?'资源不足':'交付补给'}</button></article>`;}).join('')}</div><div class="supply-actions"><button class="primary" data-action="collect">${icon('leaf')}收取产出</button><button class="text-button" data-action="nav" data-route="friends">去安排工作 ${icon('arrow')}</button></div></section>`;
}
function buildPage(){return `${sectionHeading('MAKE A LITTLE HOME','给小小的日常，留一片地方。','营救新朋友，安排生产、交付补给，慢慢扩建我们的小岛。')}<div class="build-grid">${[['home','暖暖小屋','每级可住 6 位玩伴。屋子不够时，新朋友会先在码头等候。'],['garden','小芽菜园','每级开放 2 个岗位。每位玩伴每 30 秒产出 2 食物，可交付菜篮换取金币。'],['sawmill','森林木工坊','每级开放 2 个岗位。每位玩伴每 30 秒产出 2 木材，可用于建设或交付补给。']].map(([key,title,desc])=>{const level=save.buildings[key],cost=buildingCost(key);return `<article class="building-card"><div class="building-art">${svg(houseArt(100,99,1.05,key,true),'0 0 200 160')}</div><div class="building-body"><span class="building-level">${level?'Lv. '+level:'等待建设'}</span><h2>${title}</h2><p>${desc}</p><div class="build-cost"><span>${icon('coin')}${cost.coins}</span><span>${icon('wood')}${cost.wood}</span></div><button class="primary ${level?'':'warm'}" data-action="build" data-building="${key}" ${level>=5?'disabled':''}>${level>=5?'已经满级':level?'扩建到 Lv. '+(level+1):'开始建设'} ${icon(level?'arrow':'build')}</button></div></article>`;}).join('')}</div>${suppliesSection()}<p class="build-info">首次通关和小岛心愿提供建设资源。补给订单可反复交付；重玩关卡不重复发放首次奖励。生产需要安排已入住的玩伴，每位最多累计 1 小时，记得收取。</p>${footer()}`;}
function render(){
 clearIdleHint();pointerStart=null;boardView?.destroy();boardView=null;
 app.innerHTML=shell(route==='home'?homePage():route==='play'?gamePage():route==='map'?mapPage():route==='friends'?friendsPage():buildPage());
 if(route==='play')boardView=new BoardView(document.querySelector('#board'),{board:game.board,n:game.n,tileHTML,reducedMotion:reduceMotion});
 armIdleHint();
}
function clearIdleHint(){clearTimeout(idleTimer);activityVersion++;}
function armIdleHint(){
 clearTimeout(idleTimer);
 if(route!=='play'||!game||game.status!=='playing'||busy||pointerStart||modalRoot.children.length||document.hidden)return;
 const token=runToken,version=activityVersion;
 idleTimer=setTimeout(()=>{
  if(token!==runToken||version!==activityVersion||route!=='play'||busy||pointerStart||modalRoot.children.length||document.hidden||game.status!=='playing')return;
  const move=suggestedMove(false);
  if(move){hint=move;selected=null;updateBoard();}
 },IDLE_HINT_DELAY);
}
function playerActivity(){
 clearIdleHint();hint=[];
 // Remove only the hint decoration; never rebuild a board while it is moving.
 document.querySelectorAll('#board .hinted').forEach(node=>node.classList.remove('hinted'));
 armIdleHint();
}
function cancelPendingRescue(){
 if(pendingRescue){game=pendingRescue.before;history.pop();pendingRescue=null;}
}
function navigate(to){if(!['home','map','friends','build','play'].includes(to))return;cancelPendingRescue();commitWin();saveRun();runToken++;busy=false;selected=null;hint=[];closeModal();route=to;render();window.scrollTo({top:0,behavior:'instant'});}
function showModal(html){clearIdleHint();hint=[];document.querySelectorAll('#board .hinted').forEach(node=>node.classList.remove('hinted'));previousFocus=document.activeElement;modalRoot.innerHTML=`<div class="modal-backdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">${html}</section></div>`;document.body.style.overflow='hidden';modalRoot.querySelector('button')?.focus();}
function closeModal(){modalRoot.innerHTML='';document.body.style.overflow='';previousFocus?.isConnected&&previousFocus.focus();armIdleHint();}
const closeButton=()=>`<button class="round-button" data-action="close-modal" aria-label="关闭">${icon('close')}</button>`;
function rulesModal(tutorial=false){showModal(`${closeButton()}<div class="modal-animal">${animalArt('rabbit')}</div><div class="modal-eyebrow">一 封 海 风 里 的 小 纸 条</div><h2 id="modal-title">我们一起，接它回家。</h2><div class="tutorial-demo"><div>${terrainArt(2)}</div><div>${terrainArt(2)}</div><div>${terrainArt(2)}</div><span>→</span><div>${terrainArt(3)}</div></div><ol class="rules-list"><li><b>交换相邻地块</b>，横向或纵向连成至少 3 个相同地形，合并升级。</li><li>地块向下掉落，上方补入新地形；<b>玩伴随地块移动</b>，合并时全部保留。</li><li>第 1—5 关，玩伴到达<b>沙滩或更高地形</b>后搭帐篷，<b>走进去才算获救</b>，获救后仍留在营地。同等级相连地块能继续送来新住户。</li><li>地形可从 T0 一路升级到 <b>T7 救援中心</b>。T6 救援小屋容纳 3 位，三座同级小屋连成一线，升级后容纳 9 位，已入住的玩伴全部保留。</li><li>第 6 关起，沿安全陆地抵达救援设施才算获救。<b>小屋平时固定，只有它自己参与同级三连升级时才允许交换</b>。满级 T7 固定，不再升级。</li></ol><p class="modal-small">三连草地 → T5 树林 → T6 小屋 → T7 中心<br>四连草地可直接建成 T6 小屋。通关后可以继续自由合成。<br>紧急倒计时每次有效交换减 1，连锁与无效交换不多扣步数。</p><button class="primary warm" data-action="close-modal">${tutorial?'准备好啦，出发！':'知道啦，继续救援'} ${icon('arrow')}</button>`);}
function startLevel(id,force=false){
 if(id<1||id>unlocked())return;
 cancelPendingRescue();
 if(game?.status==='playing'&&game.levelId!==id&&!force){showModal(`${closeButton()}<div class="modal-animal">${icon('boat')}</div><h2 id="modal-title">驶向另一片海域？</h2><p>当前这次救援会重新开始。已经回到主岛的玩伴和建设进度会保留。</p><button class="primary warm" data-action="force-start" data-level="${id}">开始第 ${id} 关 ${icon('arrow')}</button><button class="secondary" data-action="resume">继续当前救援</button>`);return;}
 closeModal();game=createGame(LEVELS[id-1]);history=[];reward=null;route='play';selected=null;hint=[];runToken++;busy=false;render();saveRun();window.scrollTo({top:0,behavior:'instant'});
 if((id===1||id===6||id===8)&&!introduced.has(id)){introduced.add(id);if(id===1)rulesModal(true);else showModal(`${closeButton()}<div class="modal-animal">${id===8?animalArt('penguin'):terrainArt(6)}</div><div class="modal-eyebrow">海 风 带 来 新 的 挑 战</div><h2 id="modal-title">${id===8?'起风了，接住小企鹅。':'亮起一盏回家的灯。'}</h2><p>${id===8?'带数字的玩伴有 8 步紧急倒计时。只有有效交换才扣步数，一次连锁只算一步。优先把它送回小屋吧。':'从这一关起，玩伴需要沿相连的安全陆地走进救援小屋。小屋固定在原位，只有参与同级三连升级时才允许交换。三座 T6 小屋可升级为容纳 9 位的 T7 救援中心！'}</p><button class="primary warm" data-action="close-modal">一起试试看 ${icon('arrow')}</button>`);}
}
function updateBoard(board=game.board){if(!boardView)return;boardView.update(board);boardView.element.setAttribute('aria-busy',String(busy));}
function refreshPlayStatus(){
 updateBoard();
 const timers=game.board.flatMap(t=>t.animals).filter(a=>a.timer!==null).map(a=>a.timer),moves=document.querySelector('#moves');
 moves.classList.toggle('urgent',!!timers.length);
 moves.textContent=moveText(timers);
 document.querySelector('.goal-number').innerHTML=goalNumber();
 document.querySelector('.goal-title').textContent=goalTitle();
 const objective=document.querySelector('#terrain-objective');objective.hidden=!game.terrainGoal||!!game.building;objective.innerHTML=terrainObjectiveContent();
 document.querySelector('#continue-building').hidden=game.status!=='won';
 document.querySelectorAll('.animal-goal').forEach((node,i)=>node.classList.toggle('saved',game.rescued.some(a=>a.id===activeLevel().animals[i].id)));
 for(const [key,cls]of [['coins','gold'],['wood','timber'],['food','food']])document.querySelector(`.resource.${cls} span`).textContent=save[key];
 document.querySelector('#feedback').textContent=playFeedback();
}
function selectTile(index){
 if(busy||modalRoot.children.length||game.status!=='playing')return;
 if(game.board[index].level<0){toast('岩石不可移动，可以从旁边绕过去');return;}
 if(game.board[index].level===MAX_TIER){toast('T7 救援中心已满级，固定在原位照顾玩伴');return;}
 if(selected===null){selected=index;hint=[];updateBoard();return;}
 if(index===selected){selected=null;updateBoard();return;}
 const n=game.n,adjacent=Math.abs(index-selected)===n||(Math.floor(index/n)===Math.floor(selected/n)&&Math.abs(index-selected)===1);
 if(adjacent){const from=selected;selected=null;runMove(from,index);}else{selected=index;updateBoard();}
}
async function runMove(a,b){
 if(busy||route!=='play'||game.status!=='playing'||modalRoot.children.length)return;
 const token=++runToken;playerActivity();selected=null;hint=[];
 pointerStart=null;
 const before=game;
 const result=swap(game,a,b,{frames:true});
 const view=boardView;
 if(!result.valid){busy=true;clearIdleHint();view.element.setAttribute('aria-busy','true');await view.returnDrag();if(token!==runToken)return;busy=false;updateBoard();toast(result.reason);armIdleHint();return;}
 busy=true;clearIdleHint();view.element.setAttribute('aria-busy','true');game=result.state;history.push([a,b]);
 if(result.rescued.length)pendingRescue={before};
 for(const frame of result.frames){
  if(token!==runToken)return;
  const feedback=document.querySelector('#feedback');
  if(frame.kind==='swap'&&frame.houseMove)feedback.textContent='同级小屋连成一线，准备升级救援中心…';
  if(frame.kind==='merge'){sound('merge');feedback.textContent=frame.upgrades.some(u=>u.level===MAX_TIER)?'T7 救援中心建成！玩伴们一起搬进新家':frame.upgrades.some(u=>u.level===6)?'一盏新灯亮了 · T6 救援小屋建成！':frame.chain>1?`${frame.chain} 次连锁 · 陆地慢慢长大了`:'合并成功 · 离家更近一步';}
  if(frame.kind==='camp-build')feedback.textContent='安全靠岸，正在搭起小帐篷…';
  if(frame.kind==='camp-enter')feedback.textContent='跟着海风，走进我们的营地…';
  if(frame.kind==='rescue'){
   pendingRescue=null;
   feedback.textContent=`${frame.rescued.length} 位玩伴已入住，会留在营地里！`;
   document.querySelector('.goal-number').innerHTML=goalNumber();
   document.querySelector('.goal-title').textContent=goalTitle();
   document.querySelectorAll('.animal-goal').forEach((node,i)=>node.classList.toggle('saved',game.rescued.some(a=>a.id===activeLevel().animals[i].id)));
   commitWin();saveRun();
  }
  if(frame.kind==='shuffle-notice')feedback.textContent='没有可移动的地块，棋盘即将变化…';
  if(frame.kind==='shuffle')feedback.textContent='正在整理棋盘，动物和营地都会保留';
  await view.transition(frame);
 }
 if(token!==runToken)return;
 commitWin();saveRun();busy=false;refreshPlayStatus();armIdleHint();
 if(result.shuffled)toast(game.building?'棋盘已整理，可以继续合成啦':'棋盘已整理，可以继续救援啦');
 if(game.status==='won'){sound('win');await view.wait(900);if(token===runToken&&route==='play'&&!modalRoot.children.length)winModal();}
 if(game.status==='lost')lostModal();
}
function winModal(){const level=activeLevel();showModal(`${closeButton()}<div class="modal-eyebrow">第 ${String(level.id).padStart(2,'0')} 关 · 平安 靠岸</div><div class="star-row">${'★'.repeat(reward?.stars||save.completed[level.id]||3)}</div><h2 id="modal-title">${game.terrainGoal?'营救站建成啦！':'欢迎回家，新朋友！'}</h2><p>${game.rescued.length} 位玩伴已经入住营地。${game.terrainGoal?'<br>本关建造目标也已完成。':''}<br>它们会留在棋盘上，也可以继续把海域合成到 T7。<br>${reward?.first?'它们将带着自己的名字，住进你的小岛。':'这次相逢，也被海风好好记住了。'}</p><div class="win-animals">${game.rescued.map(a=>animalArt(a.type)).join('')}</div>${reward?.first?`<div class="reward-row"><span>${icon('coin')} +${reward.coins}</span><span>${icon('wood')} +${reward.wood}</span></div>`:'<p class="modal-small">重玩不重复累计玩伴和首次通关奖励</p>'}<button class="primary warm" data-action="nav" data-route="home">带玩伴回岛 ${icon('home')}</button><button class="secondary" data-action="${level.id<LEVELS.length?'start':'nav'}" ${level.id<LEVELS.length?`data-level="${level.id+1}"`:'data-route="map"'}>${level.id<LEVELS.length?'继续下一次救援':'查看我们的航海手记'}</button><button class="secondary" data-action="build-terrain">继续合成到 T7 ${icon('build')}</button><button class="text-button" style="justify-content:center;width:100%;margin-top:15px" data-action="close-modal">留在营地看看</button>`);}
async function buildTerrain(){
 const next=continueBuilding(game);if(!next||next===game)return;
 const prepared=prepareBoard(next,{frames:true});
 cancelPendingRescue();const token=++runToken;busy=!!prepared.frames.length;game=next;history=[];selected=null;hint=[];closeModal();render();
 const view=boardView;game=prepared.state;
 for(const frame of prepared.frames){if(token!==runToken)return;await view.transition(frame);}
 if(token!==runToken)return;
 saveRun();busy=false;refreshPlayStatus();armIdleHint();
 if(game.status==='lost')lostModal();else toast('继续自由合成吧，营地和玩伴都会保留');
}
function lostModal(){showModal(`<div class="modal-animal">${animalArt('penguin')}</div><div class="modal-eyebrow">再 给 海 风 一 点 时 间</div><h2 id="modal-title">我们再试一次。</h2><p>${game.failure}<br>可以先观察带玩伴的地块，优先把它升级。</p><button class="primary warm" data-action="force-start" data-level="${game.levelId}">重新出发 ${icon('reset')}</button><button class="secondary" data-action="nav" data-route="home">先回小岛歇一会儿</button>`);}
function suggestedMove(plan=true){
 const moves=legalMoves(game),canonical=activeLevel().solution;
 const matches=move=>moves.some(([a,b])=>(a===move?.[0]&&b===move?.[1])||(a===move?.[1]&&b===move?.[0]));
 if(!game.building&&history.every((m,i)=>canonical[i]&&m[0]===canonical[i][0]&&m[1]===canonical[i][1])&&matches(canonical[history.length]))return canonical[history.length];
 return (plan?findPlan(game,{depth:4,width:30})[0]:null)||moves[0];
}
async function showHint(){
 if(busy||!game||game.status!=='playing')return;
 const token=runToken,version=activityVersion,current=game;
 const feedback=document.querySelector('#feedback');feedback.textContent='看看哪一片陆地，离家更近一些…';
 await pause(30);
 if(route!=='play'||busy||runToken!==token||activityVersion!==version||game!==current||modalRoot.children.length)return;
 const move=suggestedMove();
 if(move){hint=move;selected=null;updateBoard();feedback.textContent=`试试交换：第 ${Math.floor(move[0]/game.n)+1} 行 ${move[0]%game.n+1} 列 ↔ 第 ${Math.floor(move[1]/game.n)+1} 行 ${move[1]%game.n+1} 列`;}
}
document.addEventListener('click',event=>{
 const button=event.target.closest('[data-action]');if(!button||button.disabled)return;
 const {action}=button.dataset;
 playerActivity();
 if(action==='tile'){if(ignoreClick){ignoreClick=false;return;}selectTile(Number(button.dataset.index));return;}
 if(action==='nav'){navigate(button.dataset.route);return;}
 if(action==='start'||action==='force-start'){startLevel(Number(button.dataset.level),action==='force-start');return;}
 if(action==='close-modal'){closeModal();return;}
 if(action==='build-terrain'){
  buildTerrain();return;
 }
 if(action==='sound'){save.sound=!save.sound;store();button.innerHTML=icon(save.sound?'sound':'mute');button.setAttribute('aria-label',`${save.sound?'关闭':'开启'}音效`);if(save.sound)sound();return;}
 if(action==='resume'){closeModal();navigate('play');if(game?.status==='won')winModal();else if(game?.status==='lost')lostModal();return;}
 if(action==='supplies'){navigate('build');document.querySelector('#supply-orders')?.scrollIntoView({block:'start',behavior:reduceMotion?'instant':'smooth'});return;}
 if(action==='supply-order'){
  const result=fulfillOrder(save,button.dataset.order);if(result.ok){store();sound('win');render();document.querySelector('#supply-orders')?.scrollIntoView({block:'nearest'});}toast(result.message);return;
 }
 if(action==='rules'){rulesModal();return;}
 if(action==='hint'){showHint();return;}
 if(action==='retry'){
  if(busy)return;
  if(game.status!=='playing'||game.moves===0){startLevel(game.levelId,true);return;}
  showModal(`${closeButton()}<h2 id="modal-title">再出发一次？</h2><p>这一关会回到最初的棋盘。<br>你的小岛与玩伴进度都会保留。</p><button class="primary warm" data-action="force-start" data-level="${game.levelId}">重新出发 ${icon('reset')}</button><button class="secondary" data-action="close-modal">继续想一想</button>`);return;
 }
 if(action==='claim'){
  const t=milestone(button.dataset.kind);if(!t.ready)return;
  save.claims.push(`${t.kind}-${t.target}`);save.coins+=t.kind==='rescue'?80:100;if(t.kind==='rescue')save.wood+=15;
  store();render();sound('win');toast('小岛心愿达成，奖励已经收好啦');return;
 }
 if(action==='build'){
  const result=build(save,button.dataset.building);if(result.ok){store();sound('win');render();}toast(result.message);return;
 }
 if(action==='filter'){animalFilter=button.dataset.filter;render();return;}
 if(action==='job'){
  const job=button.dataset.job;
  if(job!=='rest'&&!save.buildings[job]){toast(`先到「建设」建好${job==='garden'?'小芽菜园':'森林木工坊'}，再安排工作吧`);return;}
  if(assignJob(save,button.dataset.animal,job)){store();render();toast(job==='rest'?'收好产出，去吹吹海风吧':'工作安排好了，每 30 秒会有一份新收获');}else toast('岗位暂时满啦，扩建工坊可以增加位置');return;
 }
 if(action==='collect'){
  const result=collect(save);store();render();
  toast(result.food+result.wood?`收到了 ${result.food} 份食物、${result.wood} 份木材`:'还没有可收取的产出，安排工作后每 30 秒收获一次');return;
 }
});
async function settleDrag(){
 const view=boardView,token=runToken;
 if(!view||busy||!view.dragged.size)return;
 busy=true;clearIdleHint();view.element.setAttribute('aria-busy','true');
 await view.returnDrag();
 if(token!==runToken||view!==boardView)return;
 busy=false;updateBoard();armIdleHint();
}
document.addEventListener('pointerdown',event=>{playerActivity();const cell=event.target.closest('.tile[data-index]');if(!cell||route!=='play'||!boardView||busy||modalRoot.children.length||(pointerStart&&event.pointerId!==pointerStart.id))return;pointerStart={index:Number(cell.dataset.index),x:event.clientX,y:event.clientY,id:event.pointerId,view:boardView,token:runToken};clearIdleHint();ignoreClick=false;});
document.addEventListener('pointermove',event=>{
 if(!pointerStart||event.pointerId!==pointerStart.id||busy)return;
 if(route!=='play'||!boardView||pointerStart.view!==boardView||pointerStart.token!==runToken){pointerStart=null;return;}
 const p=pointerStart,dx=event.clientX-p.x,dy=event.clientY-p.y;if(Math.hypot(dx,dy)<8)return;
 const horizontal=Math.abs(dx)>Math.abs(dy),to=p.index+(horizontal?(dx>0?1:-1):(dy>0?game.n:-game.n));
 if(to<0||to>=game.n*game.n||(horizontal&&Math.floor(to/game.n)!==Math.floor(p.index/game.n))){boardView?.resetDrag();return;}
 const cell=boardView.slots[p.index].getBoundingClientRect(),progress=Math.min(.84,Math.abs(horizontal?dx:dy)/(horizontal?cell.width:cell.height));
 boardView?.previewDrag(p.index,to,progress);
});
document.addEventListener('pointerup',event=>{
 if(!pointerStart||event.pointerId!==pointerStart.id)return;
 const p=pointerStart;pointerStart=null;const dx=event.clientX-p.x,dy=event.clientY-p.y;
 if(route!=='play'||!boardView||p.view!==boardView||p.token!==runToken)return;
 if(Math.hypot(dx,dy)<18){settleDrag();armIdleHint();return;}
 const horizontal=Math.abs(dx)>Math.abs(dy),offset=horizontal?(dx>0?1:-1):(dy>0?game.n:-game.n),to=p.index+offset;
 ignoreClick=true;setTimeout(()=>ignoreClick=false,150);
 if(to<0||to>=game.n*game.n||(horizontal&&Math.floor(p.index/game.n)!==Math.floor(to/game.n))){settleDrag();armIdleHint();return;}
 runMove(p.index,to);
});
document.addEventListener('pointercancel',()=>{pointerStart=null;settleDrag();armIdleHint();});
document.addEventListener('keydown',event=>{
 playerActivity();
 if(modalRoot.children.length){
  if(event.key==='Escape'&&modalRoot.querySelector('[data-action="close-modal"]'))closeModal();
  if(event.key==='Tab') {const buttons=[...modalRoot.querySelectorAll('button:not(:disabled)')];if(!buttons.length)return;const first=buttons[0],last=buttons.at(-1);if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();}}
  return;
 }
 if(route!=='play')return;
 const cell=event.target.closest('.tile[data-index]');
 if(cell&&['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(event.key)){
  event.preventDefault();const index=Number(cell.dataset.index),n=game.n,offset={ArrowUp:-n,ArrowDown:n,ArrowLeft:-1,ArrowRight:1}[event.key],to=index+offset;
  if(to<0||to>=n*n||(Math.abs(offset)===1&&Math.floor(index/n)!==Math.floor(to/n)))return;
  if(event.shiftKey)runMove(index,to);else document.querySelector(`.tile[data-index="${to}"]`)?.focus();
 }
 if(event.key==='Escape'&&!busy){selected=null;hint=[];updateBoard();}
});
document.addEventListener('visibilitychange',()=>{pointerStart=null;playerActivity();if(document.hidden){clearIdleHint();boardView?.finish();}else settleDrag();});
window.addEventListener('blur',()=>{pointerStart=null;clearIdleHint();settleDrag();});
window.addEventListener('focus',()=>playerActivity());
setInterval(()=>{const el=document.querySelector('#production-label');if(!el)return;const p=production(save);if(p.food+p.wood)el.textContent=`可收取 ${p.food} 食物 · ${p.wood} 木材`;},5000);
const restoredRun=loadSession(storage);
if(restoredRun&&restoredRun.game.levelId<=unlocked()){game=restoredRun.game;history=restoredRun.history;commitWin();}
render();
</script>
</body>

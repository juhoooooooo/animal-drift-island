const MAX_TIER = 7;
const isHouse = t => !!t && t.level >= 6 && t.level <= MAX_TIER;

  state.rng = x >>> 0;
  return state.rng / 4294967296;
}

const SAVE_KEY='animal-island-v1';
const MILESTONES={rescue:[3,8,15,25,40,55],levels:[3,6,10,15,20]};
const SUPPLY_ORDERS=[
  {id:'vegetables',title:'新鲜菜篮',food:10,wood:0,coins:25},
  {id:'timber',title:'修缮木料',food:0,wood:10,coins:25},
  {id:'boat',title:'出航补给',food:12,wood:8,coins:60}
];
function freshSave() {return {version:1,completed:{},residents:[],coins:100,wood:30,food:12,buildings:{home:1,garden:0,sawmill:0},claims:[],sound:true};}
function loadSave(storage,levelCount=LEVELS.length) {
  try {
    const raw=JSON.parse(storage.getItem(SAVE_KEY));
    if(!raw||raw.version!==1)return freshSave();
    const clean=freshSave();
    for(const key of ['coins','wood','food'])if(Number.isFinite(raw[key])&&raw[key]>=0)clean[key]=Math.floor(raw[key]);
    for(const [key,value]of Object.entries(raw.completed||{}))if(/^[1-9]\d*$/.test(key)&&Number(key)<=levelCount&&Number.isInteger(value)&&value>=1&&value<=3)clean.completed[key]=value;
    const ids=new Set();
    clean.residents=(Array.isArray(raw.residents)?raw.residents:[]).filter(a=>a&&typeof a.id==='string'&&['rabbit','cat','dog','penguin'].includes(a.type)&&!ids.has(a.id)&&ids.add(a.id)).map(a=>({id:a.id,type:a.type,name:String(a.name||'新玩伴').slice(0,20),job:['rest','garden','sawmill'].includes(a.job)?a.job:'rest',lastHarvest:Number.isFinite(a.lastHarvest)?a.lastHarvest:Date.now()}));
    for(const key of ['home','garden','sawmill'])if(Number.isInteger(raw.buildings?.[key]))clean.buildings[key]=Math.max(key==='home'?1:0,Math.min(5,raw.buildings[key]));
    clean.claims=Array.isArray(raw.claims)?raw.claims.filter(c=>typeof c==='string'):[];
    clean.sound=raw.sound!==false;return clean;
  } catch {return freshSave();}
}
function persist(storage,save) {try{storage.setItem(SAVE_KEY,JSON.stringify(save));return true;}catch{return false;}}
function recordWin(save,game) {
  const first=!save.completed[game.levelId],stars=game.limit?Math.max(1,Math.min(3,1+Math.floor((game.limit-game.moves)/3))):3;
  save.completed[game.levelId]=Math.max(save.completed[game.levelId]||0,stars);
  if(first) {
    save.coins+=60+game.levelId*5;save.wood+=10;
    const names={rabbit:['棉棉','团子','小云','糯米','泡泡','松松'],cat:['橘子','饼干','奶茶','布丁','芝麻','豆豆'],dog:['阿柴','饱饱','吐司','麦麦','豆包','卷卷'],penguin:['冰宝','小蓝','团团','雪球','啵啵','点点']};
    for(const a of game.rescued)if(!save.residents.some(r=>r.id===a.id)) {
      const count=save.residents.filter(r=>r.type===a.type).length;
      save.residents.push({id:a.id,type:a.type,name:names[a.type][count%6]+(count>=6?Math.floor(count/6)+1:''),job:'rest',lastHarvest:Date.now()});
    }
  }
  return {first,stars,coins:first?60+game.levelId*5:0,wood:first?10:0};
}
function production(save,now=Date.now()) {
  let food=0,wood=0;
  for(const a of save.residents)if(a.job!=='rest') {
    const units=Math.min(120,Math.max(0,Math.floor((now-a.lastHarvest)/30000)));
    if(a.job==='garden')food+=units*2;
    if(a.job==='sawmill')wood+=units*2;
  }
  return {food,wood};
}
function collect(save,now=Date.now()) {
  const result=production(save,now);save.food+=result.food;save.wood+=result.wood;
  for(const a of save.residents)if(a.job!=='rest') {
    const units=Math.max(0,Math.floor((now-a.lastHarvest)/30000));
    a.lastHarvest+=units*30000;
  }
  return result;
}
function fulfillOrder(save,id) {

    if(!object(animal)||typeof animal.id!=='string'||physical.has(animal.id))return null;
    const original=expected.get(animal.id);
    if(!original||animal.type!==original.type)return null;

    else if(!legalMoves(game).length)game.failure='没有可用的交换，请重新出发';

}

function loadSession(storage,levels=LEVELS) {
  try {
    const value=storage.getItem(SESSION_KEY);
    if(typeof value!=='string'||value.length>MAX_BYTES)return null;
    return cleanSession(JSON.parse(value),levels);
  }catch{return null;}
}
function persistSession(storage,{game,history}) {
  try {
    if(!object(game)||!Array.isArray(history)||history.length>MAX_HISTORY)return false;
    const value=JSON.stringify({version:2,game,history});
    if(value.length>MAX_BYTES)return false;
    storage.setItem(SESSION_KEY,value);return true;
  }catch{return false;}
}
function clearSession(storage) {
  try{storage.removeItem(SESSION_KEY);return true;}catch{return false;}
}

// Keep tile DOM nodes alive across frames. Their stable engine IDs are also the
// animation identity, so a falling tile carries its animal artwork with it.
class BoardView {
  constructor(element,{board,n,tileHTML,reducedMotion=false}) {
    this.element=element;this.n=n;this.tileHTML=tileHTML;this.reducedMotion=reducedMotion;
    this.nodes=new Map();this.animations=new Set();this.dragged=new Set();this.waits=new Set();this.disposed=false;

  patch(node,tile,index) {

      this.patch(node,tile,index);

      next.set(tile.id,node);

    if(!keepRemoved)for(const {node}of removed)node.remove();

  async animate(node,keyframes,options={}) {

  async transition(frame) {

      notice.innerHTML='<span class="shuffle-notice-mark" aria-hidden="true">↻</span><strong>没有可移动的地块了</strong><span>棋盘即将变化</span><small>动物和营地都会保留</small>';
      board.append(notice);

const playFeedback=()=>game.status==='lost'?game.failure:game.status==='won'?'本关完成！玩伴们已经安全了':game.building?'修复遗迹，玩伴会一直留在这里':game.rescued.length>=game.target?'玩伴已安全，继续完成修复目标':'合并相同遗迹，带顶门廊就能保护玩伴';

function saveRun(){

}
function commitWin(){if(game?.status==='won'&&!reward){reward=recordWin(save,game);store();}}
function store(){if(!persist(storage,save))toast('浏览器暂时无法保存，当前仍可继续游玩');}
function toast(message){clearTimeout(toastTimer);const el=document.querySelector('#toast');el.textContent=message;el.classList.add('show');toastTimer=setTimeout(()=>el.classList.remove('show'),3300);}
function sound(kind='tap') {
 if(!save.sound)return;
 try {
  audioContext??=new (window.AudioContext||window.webkitAudioContext)();audioContext.resume();
  const notes=kind==='win'?[523.25,659.25,783.99]:kind==='merge'?[440,554.37]:[392];
  notes.forEach((frequency,i)=>{const o=audioContext.createOscillator(),g=audioContext.createGain(),time=audioContext.currentTime+i*.09;o.type='sine';o.frequency.value=frequency;g.gain.setValueAtTime(0,time);g.gain.linearRampToValueAtTime(.035,time+.015);g.gain.exponentialRampToValueAtTime(.001,time+.22);o.connect(g);g.connect(audioContext.destination);o.start(time);o.stop(time+.24);});
 }catch{}
}

const BUILDING_NAMES={home:'暖暖小屋',garden:'小芽菜园',sawmill:'森林木工坊'};
function workData(key){
 const capacity=key==='home'?save.buildings.home*6:save.buildings[key]*2;
 const workers=key==='home'?save.residents.slice(0,capacity):save.residents.filter(a=>a.job===key);
 const amount=key==='home'?0:workers.reduce((n,a)=>n+Math.min(120,Math.max(0,Math.floor((Date.now()-a.lastHarvest)/30000)))*2,0);
 const remaining=workers.length&&key!=='home'?Math.min(...workers.map(a=>30-Math.floor((Date.now()-a.lastHarvest)%30000/1000))):30;
 return {capacity,workers,amount,remaining};
}

 if(route!=='play'||!boardView||p.view!==boardView||p.token!==runToken)return;
 if(Math.hypot(dx,dy)<18){settleDrag();armIdleHint();return;}
 const horizontal=Math.abs(dx)>Math.abs(dy),offset=horizontal?(dx>0?1:-1):(dy>0?game.n:-game.n),to=p.index+offset;
 ignoreClick=true;setTimeout(()=>ignoreClick=false,150);
 if(to<0||to>=game.n*game.n||(horizontal&&Math.floor(p.index/game.n)!==Math.floor(to/game.n))){settleDrag();armIdleHint();return;}
 runMove(p.index,to);
});
document.addEventListener('pointercancel',()=>{pointerStart=null;settleDrag();armIdleHint();});
document.addEventListener('keydown',event=>{
 playerActivity();
 if((event.key==='Enter'||event.key===' ')&&event.target.matches('.scene-label')){event.preventDefault();event.target.dispatchEvent(new MouseEvent('click',{bubbles:true}));return;}
 if(modalRoot.children.length){
  if(event.key==='Escape'&&modalRoot.querySelector('[data-action="close-modal"]'))closeModal();
  if(event.key==='Tab') {const buttons=[...modalRoot.querySelectorAll('button:not(:disabled)')];if(!buttons.length)return;const first=buttons[0],last=buttons.at(-1);if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();}}
  return;
 }
 if(route!=='play')return;
 const cell=event.target.closest('.tile[data-index]');
 if(cell&&['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(event.key)){
  event.preventDefault();const index=Number(cell.dataset.index),n=game.n,offset={ArrowUp:-n,ArrowDown:n,ArrowLeft:-1,ArrowRight:1}[event.key],to=index+offset;
  if(to<0||to>=n*n||(Math.abs(offset)===1&&Math.floor(index/n)!==Math.floor(to/n)))return;
  if(event.shiftKey)runMove(index,to);else document.querySelector(`.tile[data-index="${to}"]`)?.focus();
 }
 if(event.key==='Escape'&&!busy){selected=null;hint=[];updateBoard();}
});
document.addEventListener('visibilitychange',()=>{pointerStart=null;playerActivity();if(document.hidden){clearIdleHint();boardView?.finish();}else settleDrag();});
window.addEventListener('blur',()=>{pointerStart=null;clearIdleHint();settleDrag();});
window.addEventListener('focus',()=>playerActivity());
setInterval(()=>{if(route==='work'){const d=workData(workBuilding),counter=document.querySelector('#work-countdown'),amount=document.querySelector('#work-amount');if(counter)counter.textContent=d.workers.length?'00:'+String(d.remaining).padStart(2,'0'):'等待安排';if(amount)amount.textContent=d.amount;}const el=document.querySelector('#production-label');if(!el)return;const p=production(save);if(p.food+p.wood)el.textContent=`可收取 ${p.food} 食物 · ${p.wood} 木材`;},1000);
const restoredRun=loadSession(storage);
if(restoredRun&&restoredRun.game.levelId<=unlocked()){game=restoredRun.game;history=restoredRun.history;commitWin();}
render();
</script>

.level-badge{flex:0 0 32%;border-radius:25px;padding:15px 8px 12px;text-align:center;background:linear-gradient(145deg,#258acb,#2188c5);border:2px solid #5cb5e2;box-shadow:inset 0 2px 0 #7bcbe9,0 3px 0 #228bc3;color:#fff7df;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px}
.level-badge>div{font-size:17px;font-weight:800;letter-spacing:1px;color:#effaff}.level-badge strong{font-size:28px;margin:0 3px}
.level-badge small{font-size:10px;letter-spacing:1px;color:#b9e6f7}.level-status{font-size:11px;font-weight:650;color:#e3f4ff}
.route-play .move-label{font-size:14px;font-weight:800;border:0;border-radius:0;padding:0;margin:0;background:none;color:#fff7d7;line-height:1.5}
.route-play .move-label.urgent{color:#ffe2a3}
.route-play .rescue-goal{display:flex;justify-content:flex-start;align-items:center;flex-direction:column;gap:0;min-height:121px;flex:1;width:auto;border-radius:25px;padding:12px 14px 10px;margin:0;background:linear-gradient(#fffaf0,#f7eddb);border:2px solid #e2f2ef;box-shadow:0 3px 0 #2795cb}
.route-play .goal-copy{max-width:none;display:flex;align-items:center;justify-content:space-between;gap:9px;width:100%}.route-play .goal-label{font-size:16px;letter-spacing:1px;color:#665f58;font-weight:800}.route-play .goal-number{font-size:12px;font-weight:800;color:#8b9b80;margin:0;white-space:nowrap}.route-play .goal-number span{font-size:11px;font-weight:500;color:#a69b84}.route-play .goal-title{display:none}
.route-play .animal-goals{display:flex;flex-wrap:wrap;align-items:end;justify-content:center;gap:14px;max-width:none;margin:4px 0 0;width:100%}
.route-play .animal-goal{background:none;opacity:1;position:relative;width:47px;height:65px;padding:0;display:flex;align-items:center;flex-direction:column;justify-content:end;gap:0;border:0;box-shadow:none;border-radius:0}
.route-play .animal-goal>svg{width:47px;height:48px;filter:drop-shadow(0 1px 0 #b4a79538)}.route-play .animal-goal>b{font-size:17px;font-weight:850;color:#514d48;line-height:1.15}.route-play .animal-goal.saved>b{color:#80ad5a}.route-play .animal-goal.saved:after{display:none}

.puzzle-surface{width:100%;padding:8px 7px 13px;background:linear-gradient(135deg,#279bd5,#218dcc);border:1px solid #40ace1;border-radius:25px;box-shadow:inset 0 2px 0 #6cc4e8;position:relative}
.route-play .board{width:100%;max-width:none;gap:4px;padding:4px;background:#218abb;border:0;border-radius:19px;overflow:hidden}
.route-play .board-cell{aspect-ratio:1}.route-play .tile{border-radius:15px;box-shadow:inset 0 2px 0 #ffffff25,inset 0 -4px 0 #00000010;background:#c5d99b;border:1px solid #ffffff12;overflow:visible}
.route-play .tile.level-0{background:linear-gradient(145deg,#8e776a,#756359)}.route-play .tile.level-1{background:linear-gradient(145deg,#d9b286,#c79b6c)}.route-play .tile.level-2{background:linear-gradient(145deg,#ead7a5,#d6bd8a)}.route-play .tile.level-3{background:linear-gradient(145deg,#bdd87c,#accb69)}.route-play .tile.level-4{background:linear-gradient(145deg,#bddb7c,#a5c763)}.route-play .tile.level-5,.route-play .tile.level-6,.route-play .tile.level-7{background:linear-gradient(145deg,#c5dc87,#aec973)}.route-play .tile.level--1{background:linear-gradient(145deg,#a2d2e2,#77b2cd)}
.route-play .tile>.terrain-art{position:absolute;inset:1%;width:98%;height:98%;pointer-events:none}
.route-play .tile.selected{outline:3px solid #fff0ab;outline-offset:-2px;box-shadow:inset 0 0 0 2px #ffe071}.route-play .tile.hinted:after{inset:0;border-width:3px;border-color:#fff4ac;border-radius:15px}

.route-play .timer-badge{background:#ed995a;border:2px solid #fff4d8;right:-1px;top:-2px;color:white;font-weight:850;border-radius:8px;z-index:7}
.route-play .game-feedback{min-height:31px;margin:1px 0 0;padding:0 3px;line-height:1.5;font-size:11px;font-weight:750;color:#e9f9ff;text-align:center;letter-spacing:0}
.swipe-guide{display:flex;flex-direction:column;align-items:center;gap:4px;padding:0 5px 1px}.swipe-guide>.icon{width:61px;height:43px;margin-top:0}.swipe-guide p{margin:0;text-align:center;font-size:12px;line-height:1.65;letter-spacing:.5px;color:#e5f7ff;font-weight:600}.swipe-guide strong{font-weight:700;color:#f0fbff}

.route-play .tool-button{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:3px;min-height:85px;min-width:0;border-radius:23px;padding:8px;background:linear-gradient(#fffdf2,#f5e9d0);border:2px solid #e3f1ee;color:#5485a0;font-size:13px;font-weight:800;box-shadow:0 5px 0 #1b81bc,inset 0 2px 0 white}
.route-play .tool-button>.icon{width:44px;height:44px}.route-play .tool-button:hover{background:#fff8e5}.route-play .tool-button:active{box-shadow:0 2px 0 #1b81bc;transform:translateY(3px)}
.route-play .terrain-guide{width:100%;max-width:none;margin-top:16px;color:#d7f2fc}.route-play .terrain-guide summary{padding:8px 5px;border-top:1px solid #8cd1ed66;font-size:10px}.route-play .terrain-guide summary>span{font-size:10px}.route-play .terrain-legend{grid-template-columns:repeat(4,minmax(0,1fr));gap:11px 7px}.route-play .legend-tile{width:75px;height:75px;background:#c5d99b;border-radius:13px;padding:2px;box-shadow:0 3px 0 #1c85be}.route-play .legend-item{font-size:10px;color:#e4f6fc}.route-play .control-help{display:none}
.route-play .shuffle-notice{background:#fff8e9fa;border:2px solid #bbdfeb;box-shadow:0 5px 0 #2784af60;color:#4d8aa7}
.route-play .rescue-spark{font-size:12px;padding:4px 7px;background:#83b858;border:1px solid #eaf6b8;color:#fffbea;border-radius:9px;box-shadow:0 2px 0 #63963f}

top:2px;right:2px;padding:2px}.route-play .timer-badge{font-size:9px;padding:2px;min-width:18px}.route-play .rescue-spark{font-size:10px;padding:3px 5px}}

const TERRAIN = ['碎石荒地', '地基轮廓', '石板路面', '单根立柱', '双柱平台', '带顶门廊', '小型祭坛', '城邦广场'];
const MAX_TIER = 7;
const isHouse = t => !!t && t.level >= 6 && t.level <= MAX_TIER;
const isFixed = t => !!t && (t.level < 0 || isHouse(t));
const MIN_SAFE_TIER = 5;
const isSafe = t => !!t && t.level >= MIN_SAFE_TIER;
const houseCapacity = level => level >= MIN_SAFE_TIER ? null : 0;
const copy = value => structuredClone(value);
function random(state) {
  let x = state.rng | 0; x ^= x << 13; x ^= x >>> 17; x ^= x << 5;
  state.rng = x >>> 0;
  return state.rng / 4294967296;
}
function tile(state, level, animals = []) {
  return {id: ++state.serial, level, animals: copy(animals), capacity: houseCapacity(level),camp:level>=MIN_SAFE_TIER?{kind:'house',occupants:[]}:null};
}
function neighbors(i,n) {
  return [i%n>0?i-1:-1,i%n<n-1?i+1:-1,i>=n?i-n:-1,i<n*(n-1)?i+n:-1].filter(x=>x>=0);
}
function groups(board,n) {
  const lines=[];
  for(let axis=0;axis<2;axis++) for(let r=0;r<n;r++) {
    let run=[];
    const flush=()=>{if(run.length>=3) lines.push(run);run=[];};
    for(let c=0;c<n;c++) {
      const i=axis?r+c*n:r*n+c, t=board[i];
      if(!t || t.level<0 || t.level>=MAX_TIER) {flush();continue;}
      if(run.length && board[run[0]].level!==t.level) flush();
      run.push(i);
    }
    flush();
  }
  const merged=[];
  for(const line of lines) {
    let group=new Set(line);
    for(let k=merged.length-1;k>=0;k--) if([...merged[k]].some(i=>group.has(i))) {
      for(const i of merged[k]) group.add(i);
      merged.splice(k,1);
    }
    merged.push(group);
  }
  return merged.map(g=>[...g].sort((a,b)=>a-b));
}
function canExchange(board,n,a,b) {
  if(!board[a]||!board[b]||!neighbors(a,n).includes(b))return false;
  if(board[a].level<0||board[b].level<0||board[a].level===board[b].level)return false;
  const after=board.slice();[after[a],after[b]]=[after[b],after[a]];
  const matches=groups(after,n);
  if(!matches.some(g=>g.includes(a)||g.includes(b)))return false;
  // A facility can only leave its anchor as part of its own upgrade.
  for(const [from,to]of [[a,b],[b,a]])if(isHouse(board[from])&&!matches.some(g=>g.includes(to)&&after[g[0]].level===board[from].level))return false;
  return true;
}
function legalMoves(state) {
  const result=[];
  for(let a=0;a<state.board.length;a++) for(const b of [a%state.n<state.n-1?a+1:-1,a+state.n]) {
    if(canExchange(state.board,state.n,a,b))result.push([a,b]);
  }
  return result;
}
function refillLevel(state) {
  if(state.refill?.length) return state.refill.shift();
  const weights=state.weights||[30,29,25,11,5], sum=weights.reduce((a,b)=>a+b,0);
  let value=random(state)*sum;
  for(let i=0;i<weights.length;i++) {value-=weights[i];if(value<0)return i;}
  return 0;
}
function gravity(state) {
  const n=state.n;
  for(let c=0;c<n;c++) {
    let bottom=n-1;
    while(bottom>=0) {
      if(isFixed(state.board[bottom*n+c])) {bottom--;continue;}
      let top=bottom;
      while(top>0) {const t=state.board[(top-1)*n+c];if(isFixed(t))break;top--;}
      const cells=[];
      for(let r=bottom;r>=top;r--) if(state.board[r*n+c])cells.push(state.board[r*n+c]);
      for(let r=bottom;r>=top;r--)state.board[r*n+c]=cells[bottom-r]||tile(state,refillLevel(state));
      bottom=top-1;
    }
  }
}
function rescue(state,emit=()=>{}) {
  const rescued=[],entries=[],registered=new Set(state.rescued.map(a=>a.id));
  for(let at=0;at<state.board.length;at++) {
    const current=state.board[at];
    if(!isSafe(current)||!current.animals.length)continue;
    for(const animal of current.animals)entries.push({animal:copy(animal),from:at,to:at});
  }
  if(entries.length)emit('shelter-ready',{entries:copy(entries)});
  for(const {animal,to}of entries) {
    const current=state.board[to];
    current.camp??={kind:'house',occupants:[]};
    current.animals=current.animals.filter(a=>a.id!==animal.id);
    if(!current.camp.occupants.some(a=>a.id===animal.id))current.camp.occupants.push({...animal,timer:null});
    current.capacity=null;
    if(!registered.has(animal.id)){registered.add(animal.id);rescued.push({...animal,timer:null});}
  }
  state.rescued.push(...rescued);
  if(rescued.length)emit('rescue',{rescued:copy(rescued),entries:copy(entries)});
  return rescued;
}
function reshuffle(state) {
  const original=state.board.slice();
  const indices=state.board.map((t,i)=>!isFixed(t)?i:-1).filter(i=>i>=0);
  for(let attempt=0;attempt<300;attempt++) {
    for(let k=indices.length-1;k>0;k--) {const j=Math.floor(random(state)*(k+1)),a=indices[k],b=indices[j];[state.board[a],state.board[b]]=[state.board[b],state.board[a]];}
    if(!groups(state.board,state.n).length&&legalMoves(state).length) return true;
  }
  state.board=original;
  return false;
}
function createGame(config) {
  const state={n:config.n||5,rng:config.seed||1,serial:0,board:[],moves:0,rescued:[],status:'playing',mode:config.mode||'beach',target:config.animals.length,limit:config.limit||null,weights:config.weights||[30,29,25,11,5],refill:copy(config.refill||[]),levelId:config.id};
  if(config.terrainGoal)state.terrainGoal=copy(config.terrainGoal);
  state.board=config.layout.map(v=>tile(state,v));
  for(const animal of config.animals)state.board[animal.at].animals.push({id:animal.id,type:animal.type,timer:animal.timer??null});
  return state;
}
function terrainGoalProgress(state) {
  if(!state.terrainGoal)return null;
  const {level,count}=state.terrainGoal;
  return {level,count,have:state.board.filter(t=>t&&t.level>=level).length};
}
function continueBuilding(state) {
  if(state.status!=='won')return state;
  return {...copy(state),status:'playing',building:true,limit:null};
}
function restoreMoves(state,emit) {
  if(state.status!=='playing'||legalMoves(state).length)return false;
  emit('shuffle-notice');
  const shuffled=reshuffle(state);
  if(shuffled)emit('shuffle');
  else {state.status='lost';state.failure='没有可用的交换，请重新出发';}
  return shuffled;
}
function prepareBoard(state,{frames=false}={}) {
  const next=copy(state),animation=[];
  const shuffled=restoreMoves(next,kind=>{if(frames)animation.push({kind,board:copy(next.board)});});
  return {state:next,frames:animation,shuffled};
}
function swap(state,a,b,{frames=false,shuffle=true}={}) {
  const invalid=reason=>({valid:false,reason,state,frames:[],chains:0,rescued:[]});
  if(state.status!=='playing')return invalid('关卡已结束');
  if(!state.board[a]||!state.board[b]||!neighbors(a,state.n).includes(b))return invalid('请选择上下左右相邻的地块');

          const distance=Math.abs(a%state.n-b%state.n)+Math.abs(Math.floor(a/state.n)-Math.floor(b/state.n));

    }
  }

    const t=state.board[i];
    value+=state.building?([0,0,0,0,8,30,100,400][t.level]||0):t.level>=4?8:0;
    if(isSafe(t))value+=22;
    for(const a of t.animals) {

}
function findPlan(state,{depth=5,width=50}={}) {
  let beam=[{state,path:[],score:boardScore(state)}],best=null;
  const seen=new Set();
  for(let d=0;d<depth;d++) {
    const candidates=[];
    for(const node of beam)for(const move of legalMoves(node.state)) {
      const result=swap(node.state,...move),s=result.state,path=[...node.path,move];
      if(s.status==='won')return path;
      if(s.status==='lost')continue;
      const key=s.board.map(t=>`${t.level}:${t.capacity}:${t.animals.map(a=>a.id+','+a.timer).join('.')}:${t.camp?.occupants.map(a=>a.id).join('.')||''}`).join('|')+':'+s.rng;
      if(seen.has(key))continue;seen.add(key);
      const score=boardScore(s)-d*2;
      const candidate={state:s,path,score};candidates.push(candidate);
      if(!best||score>best.score)best=candidate;
    }
    candidates.sort((a,b)=>b.score-a.score);beam=candidates.slice(0,width);

  }
  return best?.path||[];
}

  }

const MILESTONES={rescue:[3,8,15,25,40,55],levels:[3,6,10,15,20]};
const SUPPLY_ORDERS=[
  {id:'vegetables',title:'新鲜菜篮',food:10,wood:0,coins:25},
  {id:'timber',title:'修缮木料',food:0,wood:10,coins:25},
  {id:'boat',title:'出航补给',food:12,wood:8,coins:60}
];
function freshSave() {return {version:1,completed:{},residents:[],coins:100,wood:30,food:12,buildings:{home:1,garden:0,sawmill:0},claims:[],sound:true};}
function loadSave(storage,levelCount=LEVELS.length) {
  try {
    const raw=JSON.parse(storage.getItem(SAVE_KEY));
    if(!raw||raw.version!==1)return freshSave();
    const clean=freshSave();
    for(const key of ['coins','wood','food'])if(Number.isFinite(raw[key])&&raw[key]>=0)clean[key]=Math.floor(raw[key]);
    for(const [key,value]of Object.entries(raw.completed||{}))if(/^[1-9]\d*$/.test(key)&&Number(key)<=levelCount&&Number.isInteger(value)&&value>=1&&value<=3)clean.completed[key]=value;
    const ids=new Set();
    clean.residents=(Array.isArray(raw.residents)?raw.residents:[]).filter(a=>a&&typeof a.id==='string'&&['rabbit','cat','dog','penguin'].includes(a.type)&&!ids.has(a.id)&&ids.add(a.id)).map(a=>({id:a.id,type:a.type,name:String(a.name||'新玩伴').slice(0,20),job:['rest','garden','sawmill'].includes(a.job)?a.job:'rest',lastHarvest:Number.isFinite(a.lastHarvest)?a.lastHarvest:Date.now()}));
    for(const key of ['home','garden','sawmill'])if(Number.isInteger(raw.buildings?.[key]))clean.buildings[key]=Math.max(key==='home'?1:0,Math.min(5,raw.buildings[key]));
    clean.claims=Array.isArray(raw.claims)?raw.claims.filter(c=>typeof c==='string'):[];
    clean.sound=raw.sound!==false;return clean;
  } catch {return freshSave();}
}
function persist(storage,save) {try{storage.setItem(SAVE_KEY,JSON.stringify(save));return true;}catch{return false;}}
function recordWin(save,game) {
  const first=!save.completed[game.levelId],stars=game.limit?Math.max(1,Math.min(3,1+Math.floor((game.limit-game.moves)/3))):3;
  save.completed[game.levelId]=Math.max(save.completed[game.levelId]||0,stars);
  if(first) {
    save.coins+=60+game.levelId*5;save.wood+=10;
    const names={rabbit:['棉棉','团子','小云','糯米','泡泡','松松'],cat:['橘子','饼干','奶茶','布丁','芝麻','豆豆'],dog:['阿柴','饱饱','吐司','麦麦','豆包','卷卷'],penguin:['冰宝','小蓝','团团','雪球','啵啵','点点']};
    for(const a of game.rescued)if(!save.residents.some(r=>r.id===a.id)) {
      const count=save.residents.filter(r=>r.type===a.type).length;
      save.residents.push({id:a.id,type:a.type,name:names[a.type][count%6]+(count>=6?Math.floor(count/6)+1:''),job:'rest',lastHarvest:Date.now()});
    }
  }
  return {first,stars,coins:first?60+game.levelId*5:0,wood:first?10:0};
}
function production(save,now=Date.now()) {
  let food=0,wood=0;
  for(const a of save.residents)if(a.job!=='rest') {
    const units=Math.min(120,Math.max(0,Math.floor((now-a.lastHarvest)/30000)));
    if(a.job==='garden')food+=units*2;
    if(a.job==='sawmill')wood+=units*2;
  }
  return {food,wood};
}
function collect(save,now=Date.now()) {
  const result=production(save,now);save.food+=result.food;save.wood+=result.wood;
  for(const a of save.residents)if(a.job!=='rest') {
    const units=Math.max(0,Math.floor((now-a.lastHarvest)/30000));
    a.lastHarvest+=units*30000;
  }
  return result;
}
function fulfillOrder(save,id) {
  const order=SUPPLY_ORDERS.find(order=>order.id===id);
  if(!order)return {ok:false,message:'这份补给订单不存在'};
  if((order.food&&!save.buildings.garden)||(order.wood&&!save.buildings.sawmill))return {ok:false,message:order.food&&order.wood?'先建好菜园和木工坊，再准备出航补给':order.food?'先建好菜园，再准备新鲜菜篮':'先建好木工坊，再准备修缮木料'};
  if(save.food<order.food||save.wood<order.wood)return {ok:false,message:`需要 ${order.food} 食物和 ${order.wood} 木材，收取产出后再来吧`};
  save.food-=order.food;save.wood-=order.wood;save.coins+=order.coins;
  return {ok:true,message:`${order.title}已交付，获得 ${order.coins} 金币`,coins:order.coins,food:order.food,wood:order.wood};
}
function build(save,key) {
  const level=save.buildings[key];
  if(!['home','garden','sawmill'].includes(key)||level>=5)return {ok:false,message:'已经达到当前版本的最高等级'};
  const coins=key==='home'?100*level:80*(level+1),wood=key==='home'?25*level:20*(level+1);
  if(save.coins<coins||save.wood<wood)return {ok:false,message:`需要 ${coins} 金币和 ${wood} 木材`};
  save.coins-=coins;save.wood-=wood;save.buildings[key]++;return {ok:true,message:key==='home'?'小屋扩建完成，更多玩伴可以入住啦':'建设完成，可以安排玩伴工作啦'};
}
function assignJob(save,id,job,now=Date.now()) {
  const animal=save.residents.find(a=>a.id===id);
  if(!animal)return false;
  if(job!=='rest'&&save.residents.indexOf(animal)>=save.buildings.home*6)return false;
  if(!['rest','garden','sawmill'].includes(job))return false;
  if(job!=='rest'&&(!save.buildings[job]||save.residents.filter(a=>a.id!==id&&a.job===job).length>=save.buildings[job]*2))return false;
  collect(save,now);animal.job=job;animal.lastHarvest=now;return true;
}

// Build a fresh engine state from known fields; storage never supplies rules or markup.
function cleanSession(raw,levels) {

  if(source.refill.length>refill.length||!source.refill.every((level,index)=>level===refill[refill.length-source.refill.length+index]))return null;

    if(!object(animal)||typeof animal.id!=='string'||physical.has(animal.id))return null;
    const original=expected.get(animal.id);
    if(!original||animal.type!==original.type)return null;

  };
  const board=[];
  for(const stored of source.board) {
    if(!object(stored)||!integer(stored.id,1,source.serial)||tileIds.has(stored.id)||!integer(stored.level,-1,7)||!Array.isArray(stored.animals)||(stored.level>=5?stored.capacity!==null:stored.capacity!==0))return null;

    for(const animal of stored.animals){const clean=cleanAnimal(animal,false);if(!clean)return null;current.animals.push(clean);}
    if(stored.camp!==null) {
      if(!object(stored.camp)||stored.level<5||stored.camp.kind!=='house'||!Array.isArray(stored.camp.occupants))return null;
      current.camp={kind:stored.camp.kind,occupants:[]};
      for(const animal of stored.camp.occupants){const clean=cleanAnimal(animal,true);if(!clean)return null;current.camp.occupants.push(clean);occupants.set(clean.id,clean);}
    }
    if(stored.level>=5&&!current.camp||stored.level<0&&(current.animals.length||current.camp))return null;

  if(game.status==='won'&&!complete||game.status==='playing'&&(expired||exhausted||!game.building&&complete))return null;

}

function loadSession(storage,levels=LEVELS) {
  try {
    const value=storage.getItem(SESSION_KEY);
    if(typeof value!=='string'||value.length>MAX_BYTES)return null;
    return cleanSession(JSON.parse(value),levels);
  }catch{return null;}
}
function persistSession(storage,{game,history}) {
  try {
    if(!object(game)||!Array.isArray(history)||history.length>MAX_HISTORY)return false;
    const value=JSON.stringify({version:2,game,history});
    if(value.length>MAX_BYTES)return false;
    storage.setItem(SESSION_KEY,value);return true;
  }catch{return false;}
}
function clearSession(storage) {
  try{storage.removeItem(SESSION_KEY);return true;}catch{return false;}
}

function render(){

function clearIdleHint(){clearTimeout(idleTimer);activityVersion++;}
function armIdleHint(){
 clearTimeout(idleTimer);
 if(route!=='play'||!game||game.status!=='playing'||busy||pointerStart||modalRoot.children.length||document.hidden)return;
 const token=runToken,version=activityVersion;
 idleTimer=setTimeout(()=>{
  if(token!==runToken||version!==activityVersion||route!=='play'||busy||pointerStart||modalRoot.children.length||document.hidden||game.status!=='playing')return;
  const move=suggestedMove(false);
  if(move){hint=move;selected=null;updateBoard();}
 },IDLE_HINT_DELAY);
}

function closeModal(){modalRoot.innerHTML='';document.body.style.overflow='';app.inert=false;previousFocus?.isConnected&&previousFocus.focus();armIdleHint();}
const closeButton=()=>`<button class="round-button" data-action="close-modal" aria-label="关闭">${icon('close')}</button>`;
function rulesModal(tutorial=false){showModal(`${closeButton()}<div class="modal-animal">${animalArt('rabbit')}</div><div class="modal-eyebrow">给玩伴一个安心的家</div><h2 id="modal-title">修复遗迹，一起回家。</h2><div class="tutorial-demo"><div>${terrainArt(4)}</div><div>${terrainArt(4)}</div><div>${terrainArt(4)}</div><span>→</span><div>${terrainArt(5)}</div></div><ol class="rules-list"><li>拖动相邻地块，横向或纵向连成至少 <b>3 个相同遗迹</b>，合并升级。</li><li>玩伴随地块移动，合并时所有玩伴都会保留。遗迹共有 <b>8 个修复阶段</b>。</li><li>动物所在的地块达到 <b>带顶门廊（T5）</b>后，才算完全安全。低级遗迹上的玩伴还需要帮助。</li><li>同一地块的玩伴会<b>一起获救，没有人数上限</b>，获救后会留在原处。同种玩伴也会分别计数。</li><li>祭坛需要参与同级三连升级才能移动；城邦广场固定。紧急倒计时只在有效交换后减少。</li></ol><p class="modal-small">重玩不会重复增加累计玩伴和首次通关奖励。<br>没有可用交换时，会先提示再整理棋盘。</p><button class="primary" data-action="close-modal">${tutorial?'准备好啦，出发！':'知道啦，继续救援'} ${icon('play')}</button>`);}
function startLevel(id,force=false){
 if(id<1||id>unlocked())return;
 cancelPendingRescue();
 if(game?.status==='playing'&&game.levelId!==id&&!force){showModal(`${closeButton()}<div class="modal-animal">${icon('boat')}</div><h2 id="modal-title">驶向另一片海域？</h2><p>当前这次救援会重新开始。已经回到主岛的玩伴和建设进度会保留。</p><button class="primary warm" data-action="force-start" data-level="${id}">开始第 ${id} 关 ${icon('arrow')}</button><button class="secondary" data-action="resume">继续当前救援</button>`);return;}
 closeModal();game=createGame(LEVELS[id-1]);history=[];reward=null;route='play';selected=null;hint=[];runToken++;busy=false;render();saveRun();window.scrollTo({top:0,behavior:'instant'});
 if(id===1&&!introduced.has(id)){introduced.add(id);rulesModal(true);}
}
function updateBoard(board=game.board){if(!boardView)return;boardView.update(board);boardView.element.setAttribute('aria-busy',String(busy));}
function refreshPlayStatus(){
 updateBoard();
 const timers=game.board.flatMap(t=>t.animals).filter(a=>a.timer!==null).map(a=>a.timer),moves=document.querySelector('#moves');
 moves.classList.toggle('urgent',!!timers.length);
 moves.textContent=moveText(timers);moves.hidden=!timers.length&&!game.limit;
 document.querySelector('.goal-number').innerHTML=goalNumber();
 document.querySelector('.goal-title').textContent=ART_COPY(goalTitle());
 const objective=document.querySelector('#terrain-objective');objective.hidden=!game.terrainGoal||!!game.building;objective.innerHTML=terrainObjectiveContent();
 document.querySelector('#continue-building').hidden=game.status!=='won';
 document.querySelector('.animal-goals').innerHTML=goalAnimalsHTML();
 for(const [key,cls]of [['coins','gold'],['wood','timber'],['food','food']])document.querySelector(`.resource.${cls} span`).textContent=save[key];
 document.querySelector('#feedback').textContent=ART_COPY(playFeedback());
}
function selectTile(index){
 if(busy||modalRoot.children.length||game.status!=='playing')return;
 if(game.board[index].level<0){toast('岩石不可移动，可以从旁边绕过去');return;}
 if(game.board[index].level===MAX_TIER){toast('T7 城邦广场已满级，固定在原位照顾玩伴');return;}
 if(selected===null){selected=index;hint=[];updateBoard();return;}
 if(index===selected){selected=null;updateBoard();return;}
 const n=game.n,adjacent=Math.abs(index-selected)===n||(Math.floor(index/n)===Math.floor(selected/n)&&Math.abs(index-selected)===1);
 if(adjacent){const from=selected;selected=null;runMove(from,index);}else{selected=index;updateBoard();}
}
async function runMove(a,b){
 if(busy||route!=='play'||game.status!=='playing'||modalRoot.children.length)return;
 const token=++runToken;playerActivity();selected=null;hint=[];
 pointerStart=null;
 const before=game;
 const result=swap(game,a,b,{frames:true});
 const view=boardView;
 if(!result.valid){busy=true;clearIdleHint();view.element.setAttribute('aria-busy','true');await view.returnDrag();if(token!==runToken)return;busy=false;updateBoard();toast(ART_COPY(result.reason));armIdleHint();return;}
 busy=true;clearIdleHint();view.element.setAttribute('aria-busy','true');game=result.state;history.push([a,b]);
 if(result.rescued.length)pendingRescue={before};
 for(const frame of result.frames){
  if(token!==runToken)return;
  const feedback=document.querySelector('#feedback');
  if(frame.kind==='swap'&&frame.houseMove)feedback.textContent='同级祭坛连成一线，准备修复城邦广场…';
  if(frame.kind==='merge'){sound('merge');feedback.textContent=frame.upgrades.some(u=>u.level===MAX_TIER)?'T7 城邦广场建成！玩伴们一起搬进新家':frame.upgrades.some(u=>u.level===6)?'一盏新灯亮了 · T6 小型祭坛建成！':frame.chain>1?`${frame.chain} 次连锁 · 陆地慢慢长大了`:'合并成功 · 离家更近一步';}
  if(frame.kind==='shelter-ready')feedback.textContent='门廊修复完成，玩伴们安全啦…';
  if(frame.kind==='camp-enter')feedback.textContent='跟着海风，走进我们的营地…';
  if(frame.kind==='rescue'){
   pendingRescue=null;
   feedback.textContent=`成功救援 +${frame.rescued.length} · 玩伴会留在遗迹里`;
   document.querySelector('.goal-number').innerHTML=goalNumber();
   document.querySelector('.goal-title').textContent=ART_COPY(goalTitle());
   document.querySelector('.animal-goals').innerHTML=goalAnimalsHTML();
   commitWin();saveRun();
  }
  if(frame.kind==='shuffle-notice')feedback.textContent='没有可移动的地块，棋盘即将变化…';
  if(frame.kind==='shuffle')feedback.textContent='正在整理棋盘，动物和营地都会保留';
  await view.transition(frame);
 }
 if(token!==runToken)return;
 commitWin();saveRun();busy=false;refreshPlayStatus();armIdleHint();
 if(result.shuffled)toast(game.building?'棋盘已整理，可以继续合成啦':'棋盘已整理，可以继续救援啦');
 if(game.status==='won'){sound('win');await view.wait(900);if(token===runToken&&route==='play'&&!modalRoot.children.length)winModal();}
 if(game.status==='lost')lostModal();
}
function winModal(){const level=activeLevel(),groups=Object.keys(ANIMALS).map(type=>({type,count:game.rescued.filter(a=>a.type===type).length})).filter(a=>a.count);showModal(`${closeButton()}<div class="win-ribbon">成功救出玩伴！</div><div class="win-stage">${groups.map(a=>animalArt(a.type)).join('')}<span class="celebrate-spark one">✦</span><span class="celebrate-spark two">✧</span></div><h2 id="modal-title">成功救出 ${game.rescued.length} 只小动物</h2><p>第 ${level.id} 关完成，新的相逢正等着你。</p><section class="win-rewards"><h3>本关收获</h3><div class="win-animal-list">${groups.map(a=>`<span>${animalArt(a.type)}<b>${ANIMALS[a.type].label} ×${a.count}</b></span>`).join('')}</div><div class="reward-row"><span>${icon('coin')}<b>+${reward?.coins||0}</b><small>金币</small></span><span>${icon('wood')}<b>+${reward?.wood||0}</b><small>木材</small></span></div><p class="reward-note">${reward?.first?'首次通关奖励已收好':'重玩关卡，玩伴和首次奖励不会重复累计'}</p></section><div class="win-actions"><button class="secondary" data-action="return-home">${icon('home')}返回主岛</button><button class="primary" data-action="${level.id<LEVELS.length?'start':'nav'}" ${level.id<LEVELS.length?`data-level="${level.id+1}"`:'data-route="map"'}>${icon('play')}${level.id<LEVELS.length?'下一关':'查看关卡'}</button></div><button class="text-button win-stay" data-action="close-modal">留在营地看看</button>`);modalRoot.querySelector('.modal').classList.add('victory-modal');}

async function buildTerrain(){
 const next=continueBuilding(game);if(!next||next===game)return;
 const prepared=prepareBoard(next,{frames:true});
 cancelPendingRescue();const token=++runToken;busy=!!prepared.frames.length;game=next;history=[];selected=null;hint=[];closeModal();render();
 const view=boardView;game=prepared.state;
 for(const frame of prepared.frames){if(token!==runToken)return;await view.transition(frame);}
 if(token!==runToken)return;
 saveRun();busy=false;refreshPlayStatus();armIdleHint();
 if(game.status==='lost')lostModal();else toast('继续自由合成吧，营地和玩伴都会保留');
}
function lostModal(){showModal(`<div class="modal-animal">${animalArt('penguin')}</div><div class="modal-eyebrow">再 给 海 风 一 点 时 间</div><h2 id="modal-title">我们再试一次。</h2><p>${game.failure}<br>可以先观察带玩伴的地块，优先把它升级。</p><button class="primary warm" data-action="force-start" data-level="${game.levelId}">重新出发 ${icon('reset')}</button><button class="secondary" data-action="nav" data-route="home">先回小岛歇一会儿</button>`);}
function suggestedMove(plan=true){
 const moves=legalMoves(game),canonical=activeLevel().solution;
 const matches=move=>moves.some(([a,b])=>(a===move?.[0]&&b===move?.[1])||(a===move?.[1]&&b===move?.[0]));
 if(!game.building&&history.every((m,i)=>canonical[i]&&m[0]===canonical[i][0]&&m[1]===canonical[i][1])&&matches(canonical[history.length]))return canonical[history.length];
 return (plan?findPlan(game,{depth:4,width:30})[0]:null)||moves[0];
}
async function showHint(){
 if(busy||!game||game.status!=='playing')return;
 const token=runToken,version=activityVersion,current=game;
 const feedback=document.querySelector('#feedback');feedback.textContent='看看哪一片陆地，离家更近一些…';
 await pause(30);
 if(route!=='play'||busy||runToken!==token||activityVersion!==version||game!==current||modalRoot.children.length)return;
 const move=suggestedMove();
 if(move){hint=move;selected=null;updateBoard();feedback.textContent=`试试交换：第 ${Math.floor(move[0]/game.n)+1} 行 ${move[0]%game.n+1} 列 ↔ 第 ${Math.floor(move[1]/game.n)+1} 行 ${move[1]%game.n+1} 列`;}
}
document.addEventListener('click',event=>{
 const button=event.target.closest('[data-action]');if(!button||button.disabled)return;
 const {action}=button.dataset;
 if(action==='building-details'){workBuilding=button.dataset.building;navigate('work');return;}
 if(action==='work-invite'){if(button.dataset.building==='home'){startLevel(nextLevel().id);}else{document.querySelector('.available-workers')?.scrollIntoView({behavior:reduceMotion?'instant':'smooth',block:'center'});toast('点击下方空闲玩伴，就能请它来帮忙');}return;}
 if(action==='task-info'){const t=milestone(button.dataset.kind);toast(t.finished?'阶段奖励已全部领取':`达到 ${t.target} ${t.kind==='rescue'?'位玩伴，可领取 80 金币和 15 木材':'次首次通关，可领取 100 金币'}`);return;}
 if(action==='return-home'){arrivalIds=reward?.first?game.rescued.map(a=>a.id):[];navigate('home');setTimeout(()=>{arrivalIds=[];document.querySelector('.has-arrivals')?.classList.remove('has-arrivals');document.querySelector('.arrival-note')?.remove();},3200);return;}
 playerActivity();
 if(action==='tile'){if(ignoreClick){ignoreClick=false;return;}selectTile(Number(button.dataset.index));return;}
 if(action==='nav'){navigate(button.dataset.route);return;}
 if(action==='start'||action==='force-start'){startLevel(Number(button.dataset.level),action==='force-start');return;}
 if(action==='close-modal'){closeModal();return;}
 if(action==='build-terrain'){
  buildTerrain();return;
 }
 if(action==='sound'){save.sound=!save.sound;store();button.innerHTML=icon(save.sound?'sound':'mute');button.setAttribute('aria-label',`${save.sound?'关闭':'开启'}音效`);if(save.sound)sound();return;}
 if(action==='resume'){closeModal();navigate('play');if(game?.status==='won')winModal();else if(game?.status==='lost')lostModal();return;}
 if(action==='supplies'){navigate('build');document.querySelector('#supply-orders')?.scrollIntoView({block:'start',behavior:reduceMotion?'instant':'smooth'});return;}
 if(action==='supply-order'){
  const result=fulfillOrder(save,button.dataset.order);if(result.ok){store();sound('win');render();document.querySelector('#supply-orders')?.scrollIntoView({block:'nearest'});}toast(result.message);return;
 }
 if(action==='rules'){rulesModal();return;}
 if(action==='hint'){showHint();return;}
 if(action==='retry'){
  if(busy)return;
  if(game.status!=='playing'||game.moves===0){startLevel(game.levelId,true);return;}
  showModal(`${closeButton()}<h2 id="modal-title">再出发一次？</h2><p>这一关会回到最初的棋盘。<br>你的小岛与玩伴进度都会保留。</p><button class="primary warm" data-action="force-start" data-level="${game.levelId}">重新出发 ${icon('reset')}</button><button class="secondary" data-action="close-modal">继续想一想</button>`);return;
 }
 if(action==='claim'){
  const t=milestone(button.dataset.kind);if(!t.ready)return;
  save.claims.push(`${t.kind}-${t.target}`);save.coins+=t.kind==='rescue'?80:100;if(t.kind==='rescue')save.wood+=15;
  store();render();sound('win');toast('小岛心愿达成，奖励已经收好啦');return;
 }
 if(action==='build'){
  const result=build(save,button.dataset.building);if(result.ok){store();sound('win');render();}toast(result.message);return;
 }
 if(action==='filter'){animalFilter=button.dataset.filter;render();return;}
 if(action==='job'){
  const job=button.dataset.job;
  if(job!=='rest'&&!save.buildings[job]){toast(`先到「建设」建好${job==='garden'?'小芽菜园':'森林木工坊'}，再安排工作吧`);return;}
  if(assignJob(save,button.dataset.animal,job)){store();render();toast(job==='rest'?'收好产出，去吹吹海风吧':'工作安排好了，每 30 秒会有一份新收获');}else toast('岗位暂时满啦，扩建工坊可以增加位置');return;
 }
 if(action==='collect'){
  const result=collect(save);store();render();
  toast(result.food+result.wood?`收到了 ${result.food} 份食物、${result.wood} 份木材`:'还没有可收取的产出，安排工作后每 30 秒收获一次');return;
 }
});
async function settleDrag(){
 const view=boardView,token=runToken;
 if(!view||busy||!view.dragged.size)return;
 busy=true;clearIdleHint();view.element.setAttribute('aria-busy','true');
 await view.returnDrag();
 if(token!==runToken||view!==boardView)return;
 busy=false;updateBoard();armIdleHint();
}
document.addEventListener('pointerdown',event=>{playerActivity();const cell=event.target.closest('.tile[data-index]');if(!cell||route!=='play'||!boardView||busy||modalRoot.children.length||(pointerStart&&event.pointerId!==pointerStart.id))return;pointerStart={index:Number(cell.dataset.index),x:event.clientX,y:event.clientY,id:event.pointerId,view:boardView,token:runToken};clearIdleHint();ignoreClick=false;});
document.addEventListener('pointermove',event=>{
 if(!pointerStart||event.pointerId!==pointerStart.id||busy)return;
 if(route!=='play'||!boardView||pointerStart.view!==boardView||pointerStart.token!==runToken){pointerStart=null;return;}
 const p=pointerStart,dx=event.clientX-p.x,dy=event.clientY-p.y;if(Math.hypot(dx,dy)<8)return;
 const horizontal=Math.abs(dx)>Math.abs(dy),to=p.index+(horizontal?(dx>0?1:-1):(dy>0?game.n:-game.n));
 if(to<0||to>=game.n*game.n||(horizontal&&Math.floor(to/game.n)!==Math.floor(p.index/game.n))){boardView?.resetDrag();return;}
 const cell=boardView.slots[p.index].getBoundingClientRect(),progress=Math.min(.84,Math.abs(horizontal?dx:dy)/(horizontal?cell.width:cell.height));
 boardView?.previewDrag(p.index,to,progress);
});
document.addEventListener('pointerup',event=>{
 if(!pointerStart||event.pointerId!==pointerStart.id)return;
 const p=pointerStart;pointerStart=null;const dx=event.clientX-p.x,dy=event.clientY-p.y;
 if(route!=='play'||!boardView||p.view!==boardView||p.token!==runToken)return;
 if(Math.hypot(dx,dy)<18){settleDrag();armIdleHint();return;}
 const horizontal=Math.abs(dx)>Math.abs(dy),offset=horizontal?(dx>0?1:-1):(dy>0?game.n:-game.n),to=p.index+offset;
 ignoreClick=true;setTimeout(()=>ignoreClick=false,150);
 if(to<0||to>=game.n*game.n||(horizontal&&Math.floor(p.index/game.n)!==Math.floor(to/game.n))){settleDrag();armIdleHint();return;}
 runMove(p.index,to);
});
document.addEventListener('pointercancel',()=>{pointerStart=null;settleDrag();armIdleHint();});
document.addEventListener('keydown',event=>{
 playerActivity();
 if((event.key==='Enter'||event.key===' ')&&event.target.matches('.scene-label')){event.preventDefault();event.target.dispatchEvent(new MouseEvent('click',{bubbles:true}));return;}
 if(modalRoot.children.length){
  if(event.key==='Escape'&&modalRoot.querySelector('[data-action="close-modal"]'))closeModal();
  if(event.key==='Tab') {const buttons=[...modalRoot.querySelectorAll('button:not(:disabled)')];if(!buttons.length)return;const first=buttons[0],last=buttons.at(-1);if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();}}
  return;
 }
 if(route!=='play')return;
 const cell=event.target.closest('.tile[data-index]');
 if(cell&&['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(event.key)){
  event.preventDefault();const index=Number(cell.dataset.index),n=game.n,offset={ArrowUp:-n,ArrowDown:n,ArrowLeft:-1,ArrowRight:1}[event.key],to=index+offset;
  if(to<0||to>=n*n||(Math.abs(offset)===1&&Math.floor(index/n)!==Math.floor(to/n)))return;
  if(event.shiftKey)runMove(index,to);else document.querySelector(`.tile[data-index="${to}"]`)?.focus();
 }
 if(event.key==='Escape'&&!busy){selected=null;hint=[];updateBoard();}
});
document.addEventListener('visibilitychange',()=>{pointerStart=null;playerActivity();if(document.hidden){clearIdleHint();boardView?.finish();}else settleDrag();});
window.addEventListener('blur',()=>{pointerStart=null;clearIdleHint();settleDrag();});
window.addEventListener('focus',()=>playerActivity());
setInterval(()=>{if(route==='work'){const d=workData(workBuilding),counter=document.querySelector('#work-countdown'),amount=document.querySelector('#work-amount');if(counter)counter.textContent=d.workers.length?'00:'+String(d.remaining).padStart(2,'0'):'等待安排';if(amount)amount.textContent=d.amount;}const el=document.querySelector('#production-label');if(!el)return;const p=production(save);if(p.food+p.wood)el.textContent=`可收取 ${p.food} 食物 · ${p.wood} 木材`;},1000);
const restoredRun=loadSession(storage);
if(restoredRun&&restoredRun.game.levelId<=unlocked()){game=restoredRun.game;history=restoredRun.history;commitWin();}
render();
</script>
